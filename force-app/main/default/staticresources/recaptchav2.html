<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <div id="recaptcha-container"></div>

    <script>
        const isBuilder =
            location.hostname.includes('live-preview.salesforce-experience.com');

        function onCaptchaSuccess(token) {
            setTimeout(() => {
                parent.postMessage(
                    {
                        action: 'getCAPTCHA',
                        token: token
                    },
                    '*'
                );
            }, 300);
        }

        if (!isBuilder) {
            window.onload = function () {
                grecaptcha.render('recaptcha-container', {
                    sitekey: '6Lf_T2EtAAAAAG1TuQWMMC3jE4hfx0IPnT-O8Wkq',
                    callback: onCaptchaSuccess
                });
            };
        }
    </script>
</body>
</html>
