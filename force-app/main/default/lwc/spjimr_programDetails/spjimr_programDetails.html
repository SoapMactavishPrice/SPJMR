                    <div class="student-details-wrapper">
                        <div class="student-details-header-bar">
                            <h2 class="student-details-header-text dxp-text-heading-xxsmall">
                                Programme Details
                            </h2>
                        </div>

                        <div class="slds-m-top--large studentDetailsCard">
                            <article class="slds-card article-card">
                                <div class="slds-card__body slds-card__body_inner slds-m-top--x-large">
                                    <div class="slds-grid slds-gutters">
                                        <!-- Left Column: Personal Details -->
                                        <div class="slds-col slds-size_1-of-3">
                                            <h3 class="slds-section-title dxp-text-heading-xsmall section-title">Programme
                                                Overview</h3>
                                            <div style="margin-left:5px">
                                                <dl class="slds-dl_horizontal slds-m-top_small">
                                                    <dt class="slds-dl_horizontal__label">
                                                        <p class="slds-truncate dxp-text-body">Programme Name</p>
                                                    </dt>
                                                    <dd class="slds-dl_horizontal__detail program-detail-value-wrap">
                                                        <p class="dxp-text-body">{displayProgramName}</p>
                                                    </dd>
                                                    <dt class="slds-dl_horizontal__label">
                                                        <p class="slds-truncate dxp-text-body ">Programme Code</p>
                                                    </dt>
                                                    <dd class="slds-dl_horizontal__detail">
                                                        <p class="slds-truncate  dxp-text-body">{displayProgramCode}</p>
                                                    </dd>
                                                    <dt class="slds-dl_horizontal__label">
                                                        <p class="slds-truncate dxp-text-body ">Duration</p>
                                                    </dt>
                                                    <dd class="slds-dl_horizontal__detail">
                                                        <p class="slds-truncate  dxp-text-body">{displayProgramDuration}</p>
                                                    </dd>
                                                    <dt class="slds-dl_horizontal__label">
                                                        <p class="slds-truncate dxp-text-body ">Term</p>
                                                    </dt>
                                                    <dd class="slds-dl_horizontal__detail slds-m-top_none">
                                                        <lightning-combobox class="dxp-text-body term-pill"
                                                            variant="label-hidden" options={student.termOptions}
                                                            value={selectedTermValue} onchange={handleTermChange}>
                                                        </lightning-combobox>
                                                        <!-- <p class="slds-truncate  dxp-text-body">{student.term}</p> -->
                                                    </dd>
                                                </dl>
                                            </div>
