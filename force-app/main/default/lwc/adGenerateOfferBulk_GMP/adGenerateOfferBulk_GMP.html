<template>
    <lightning-card title="Generate Offers" icon-name="standard:contact">
        
        <div class="slds-m-around_medium">
            <div class="button-container" style="text-align:right; padding:6px;">
                    <template lwc:if={isSelected}>
                        <lightning-button label="Generate Offer" onclick={generateOfferBulk} variant="neutral" class="slds-m-bottom_small"></lightning-button>
                        
                    </template>
                    <template lwc:else>
                        <lightning-button label="Generate Offer" onclick={convertToStudent} variant="neutral" class="slds-m-bottom_small" disabled></lightning-button>
                        
                    </template>
            </div>
            <div>
                <lightning-datatable data-id="datatable" key-field="Id" data={data} columns={columns} selected-rows={selectedRows}
                    onrowaction={handleRowAction}
                    onrowselection={handleRowSelection}>
                </lightning-datatable>
            </div>
        </div>
        <!--  Pagination Buttons Start -->
        <div class="slds-align_absolute-center">
            <lightning-button label="Previous" icon-name="utility:chevronleft" onclick={previousHandler}
                disabled={isPreviousDisable}>
            </lightning-button>
            <span class="slds-badge slds-badge_lightest"
                        style="margin-right: 10px;margin-left: 10px;">
                       Displaying {startingRecord} to {endingRecord} of {totalRecountCount} records.<br>
                     Page {page} of {totalPage}.
            </span>
            <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right" onclick={nextHandler}
                disabled={isNextDisable}>
            </lightning-button>
        </div>
        <!--  Pagination Buttons End -->
        <!-- Datatable with Pagination End -->
    </lightning-card>
</template>
