<template>

    <!-- Checking eligibility -->
    <template if:true={isCheckingEligibility}>
        <div class="eligibility-checking">
            Checking your withdrawal window...
        </div>
    </template>

    <!-- Outside the active withdrawal window -->
    <template if:true={showUnavailableMessage}>
        <div class="unavailable-box">
            {eligibilityMessage}
        </div>
    </template>

    <!-- Within the active withdrawal window -->
    <template if:true={showWithdrawalForm}>

    <div class="withdrawal-form">

        <!-- Window info -->
        <template if:true={eligibilityMessage}>
            <div class="window-banner">
                {eligibilityMessage}
            </div>
        </template>

        <!-- Success Message -->
        <template if:true={submitSuccess}>
            <div class="success-banner">
                <span class="success-check">✓</span>
                Withdrawal Request submitted successfully!
            </div>
        </template>

        <!-- Header -->
        <div class="withdrawal-header">
            Withdrawal Request
        </div>

        <!-- Reason for Withdrawal + Bank Account Details -->
        <div class="field-row">

            <div class="field-block field-block_half">
                <label class="field-label">
                    Reason for Withdrawal
                    <span class="required-mark">*</span>
                </label>

                <select
                    class={reasonFieldClass}
                    value={reason}
                    onchange={handleReasonChange}>
                    <option value="">Select reason</option>
                    <template for:each={reasonOptions} for:item="option">
                        <option key={option.value} value={option.value}>{option.label}</option>
                    </template>
                </select>

                <template if:true={reasonHasError}>
                    <p class="field-error">
                        This field is required.
                    </p>
                </template>
            </div>

            <div class="field-block field-block_half">
                <label class="field-label">
                    Bank Account Details for Refund
                </label>

                <textarea
                    class="bank-textarea"
                    placeholder="Account no., IFSC, Bank name..."
                    value={bankDetails}
                    onchange={handleBankDetailsChange}>
                </textarea>
            </div>

        </div>

        <!-- Document Upload -->
        <div class="field-block">
            <label class="field-label">
                Document
            </label>

            <div class="upload-box">

                <p class="upload-title">
                    Upload Document
                </p>

                <label class="upload-browse">
                    Browse Files

                    <input
                        type="file"
                        data-field="document"
                        accept=".pdf,.jpg,.jpeg"
                        onchange={handleFileChange}
                        class="upload-input"
                    />
                </label>

                <p class="upload-hint">
                    Must be .pdf, .jpg file and not exceeding
                    <strong>10mb</strong> file size
                </p>

                <template if:true={documentFile}>
                    <p class="upload-filename">
                        {documentFile.name}
                    </p>
                </template>

            </div>
        </div>

        <!-- Name + Application ID -->
        <div class="field-row">

            <div class="field-block field-block_half">
                <label class="field-label">
                    Your Name
                    <span class="required-mark">*</span>
                </label>

                <input
                    type="text"
                    class={nameFieldClass}
                    placeholder="Your Name"
                    value={studentName}
                    onchange={handleNameChange}
                />

                <template if:true={nameHasError}>
                    <p class="field-error">
                        This field is required.
                    </p>
                </template>
            </div>

            <div class="field-block field-block_half">
                <label class="field-label">
                    Your Application ID
                    <span class="required-mark">*</span>
                </label>

                <input
                    type="text"
                    class={applicationIdFieldClass}
                    placeholder="Application ID"
                    value={applicationId}
                    onchange={handleApplicationIdChange}
                />

                <template if:true={applicationIdHasError}>
                    <p class="field-error">
                        This field is required.
                    </p>
                </template>
            </div>

        </div>

        <!-- Roll Number + Registered Email -->
        <div class="field-row">

            <div class="field-block field-block_half">
                <label class="field-label">
                    Your Roll Number
                    <span class="required-mark">*</span>
                </label>

                <input
                    type="text"
                    class={rollNumberFieldClass}
                    placeholder="Roll Number"
                    value={rollNumber}
                    onchange={handleRollNumberChange}
                />

                <template if:true={rollNumberHasError}>
                    <p class="field-error">
                        This field is required.
                    </p>
                </template>
            </div>

            <div class="field-block field-block_half">
                <label class="field-label">
                    Your Registered Email ID
                    <span class="required-mark">*</span>
                </label>

                <input
                    type="email"
                    class={registeredEmailFieldClass}
                    placeholder="Registered Email"
                    value={registeredEmail}
                    onchange={handleRegisteredEmailChange}
                />

                <template if:true={registeredEmailHasError}>
                    <p class="field-error">
                        {registeredEmailErrorMessage}
                    </p>
                </template>
            </div>

        </div>

        <!-- SPJIMR Email + Reasons for Choice -->
        <div class="field-row">

            <div class="field-block field-block_half">
                <label class="field-label">
                    Your SPJIMR Email ID
                    <span class="required-mark">*</span>
                </label>

                <input
                    type="email"
                    class={spjimrEmailFieldClass}
                    placeholder="SPJIMR Email"
                    value={spjimrEmail}
                    onchange={handleSpjimrEmailChange}
                />

                <template if:true={spjimrEmailHasError}>
                    <p class="field-error">
                        {spjimrEmailErrorMessage}
                    </p>
                </template>
            </div>

            <div class="field-block field-block_half">
                <label class="field-label">
                    Reasons for Choice (top 2)
                </label>

                <select
                    class="reasons-choice-select"
                    multiple
                    size="4"
                    onchange={handleReasonsChoiceChange}>
                    <template for:each={reasonsChoiceOptions} for:item="option">
                        <option
                            key={option.value}
                            value={option.value}
                            selected={option.isSelected}>
                            {option.label}
                        </option>
                    </template>
                </select>

                <p class="field-hint">
                    Hold Ctrl / Cmd to select up to 2 reasons.
                </p>

                <template if:true={reasonsChoiceHasError}>
                    <p class="field-error">
                        You can select a maximum of 2 reasons.
                    </p>
                </template>
            </div>

        </div>

        <!-- Any Other Information -->
        <div class="field-block">
            <label class="field-label">
                Any Other Information
            </label>

            <textarea
                class="other-info-textarea"
                placeholder="Additional information..."
                value={otherInformation}
                onchange={handleOtherInformationChange}>
            </textarea>
        </div>

        <!-- Action Buttons -->
        <div class="action-row">

            <button
                type="button"
                class="upload-action-btn"
                onclick={handleUploadClick}>
                Upload
            </button>

            <button
                type="button"
                class="submit-btn"
                onclick={handleSubmit}
                disabled={isSubmitting}>
                Submit Request
            </button>

        </div>

    </div>

    <div class="tracker-card">
        <div class="tracker-header">Withdrawal Status Tracker</div>

        <div class="status-pill">{trackerStatusLabel}</div>

        <div class="tracker-row">
            <template for:each={trackerSteps} for:item="step">
                <div class="tracker-step" key={step.key}>
                    <div class={step.circleClass}>{step.number}</div>
                    <div class={step.labelClass}>{step.label}</div>
                </div>
            </template>
        </div>

        <div class="tracker-table-wrap">
            <table class="tracker-table">
                <thead>
                    <tr>
                        <th>Request No.</th>
                        <th>Submitted Date</th>
                        <th>Name</th>
                        <th>Application ID</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Approved / Rejected</th>
                        <th>Remark</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>{trackerRequestNumberDisplay}</td>
                        <td>{trackerSubmittedDateDisplay}</td>
                        <td>{trackerNameDisplay}</td>
                        <td>{trackerApplicationIdDisplay}</td>
                        <td>{trackerReasonDisplay}</td>
                        <td><span class="status-badge">{trackerStatusBadgeLabel}</span></td>
                        <td>{trackerApprovedRejectedDisplay}</td>
                        <td>{trackerRemarkDisplay}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    </template>

</template>
