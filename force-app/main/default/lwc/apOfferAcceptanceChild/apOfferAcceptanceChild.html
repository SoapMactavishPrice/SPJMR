<template>
    <template lwc:if={isLoaded}>
        <div class="section">

            <!-- ═══════════════════════════════════════════════════════════════
                 IMPORTANT DOCUMENTS - DOWNLOADS ONLY
                 (DisplayAsImportantDocument = true, FilterCondition passed)
            ════════════════════════════════════════════════════════════════ -->
            <template lwc:if={hasImportantDocs}>
                <template for:each={importantDocs} for:item="doc">
                    <div key={doc.id} class="card">
                        <div class="row space-between center">
                            <h2 class="label">{doc.name}</h2>
                            <template lwc:if={doc.url}>
                                <lightning-button
                                    label="Download"
                                    icon-name="utility:download"
                                    variant="neutral"
                                    class="download-btn"
                                    data-url={doc.url}
                                    onclick={handleDownloadImportantDoc}>
                                </lightning-button>
                            </template>
                        </div>
                    </div>
                </template>
            </template>

            <!-- ═══════════════════════════════════════════════════════════════
                 ANNEXURES
            ════════════════════════════════════════════════════════════════ -->
            <div class="card">
                <h2 class="label">Annexures</h2>

                <template lwc:if={hasAnnexures}>
                    <template for:each={annexures} for:item="ann">
                        <div key={ann.Id} class="annexure-row row space-between center">
                            <span class="annexure-title">
                                <lightning-icon icon-name="utility:file" size="x-small" class="annexure-icon">
                                </lightning-icon>
                                {ann.name}
                            </span>
                            <lightning-button
                                label="Download"
                                icon-name="utility:download"
                                variant="base"
                                data-id={ann.value}
                                onclick={handleDownloadAnnexure}>
                            </lightning-button>
                        </div>
                    </template>
                </template>

                <template lwc:else>
                    <p class="empty">No annexures available.</p>
                </template>
            </div>

            <!-- ═══════════════════════════════════════════════════════════════
                 UPLOAD SIGNED OFFER LETTER + IMPORTANT DOCUMENT UPLOADS
                 (rendered together as a 2-column grid)
            ════════════════════════════════════════════════════════════════ -->
            <div class="upload-grid">
                <template lwc:if={showOfferUploadSection}>
                    <div class="card card-processing-wrap">
                        <template lwc:if={isOfferLetterProcessing}>
                            <div class="card-loader" role="status" aria-live="polite">
                                <lightning-spinner alternative-text="Saving document" size="small"></lightning-spinner>
                                <span class="card-loader-text">Saving...</span>
                            </div>
                        </template>
                        <template lwc:elseif={isOfferLetterPresent}>
                            <div class="uploaded-box">
                                <lightning-icon icon-name="utility:success" variant="success" size="small">
                                </lightning-icon>
                                <div class="uploaded-content">
                                    <span class="uploaded-text">Signed Offer Letter uploaded</span>
                                    <div class="uploaded-letter">
                                        <a href={offerLetterLink} target="_blank">View file</a>
                                        <template lwc:if={canDeleteDocuments}>
                                            <lightning-button-icon
                                                icon-name="utility:delete"
                                                variant="bare"
                                                size="small"
                                                class="delete-icon"
                                                alternative-text="Delete Offer Letter"
                                                onclick={handleOfferDelete}>
                                            </lightning-button-icon>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <template lwc:else>
                            <template lwc:if={isReadOnly}>
                                <div class="uploaded-box">
                                    <lightning-icon icon-name="utility:lock" size="small"></lightning-icon>
                                    <div class="uploaded-content">
                                        <span class="uploaded-text">Signed Offer Letter — upload closed</span>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <h2 class="label">Upload Signed Offer Letter</h2>
                                <p class="message">PDF, JPG or PNG. Make sure the file is clearly named before uploading.</p>
                                <lightning-file-upload
                                    label="Upload Offer Letter"
                                    name="offerLetterUpload"
                                    accept=".pdf,.jpg,.jpeg,.png"
                                    record-id={applicationId}
                                    file-field-name={fileFieldName}
                                    onuploadfinished={handleOfferUpload}>
                                </lightning-file-upload>
                            </template>
                        </template>
                    </div>
                </template>

                <template for:each={importantDocsWithUpload} for:item="doc">
                    <div key={doc.id} class="card card-processing-wrap">
                        <template lwc:if={doc.isProcessing}>
                            <div class="card-loader" role="status" aria-live="polite">
                                <lightning-spinner alternative-text="Saving document" size="small"></lightning-spinner>
                                <span class="card-loader-text">Saving...</span>
                            </div>
                        </template>
                        <template lwc:elseif={doc.uploaded}>
                            <div class="uploaded-box">
                                <lightning-icon icon-name="utility:success" variant="success" size="small">
                                </lightning-icon>
                                <div class="uploaded-content">
                                    <span class="uploaded-text">Signed {doc.name} uploaded</span>
                                    <div class="uploaded-letter">
                                        <a href={doc.uploadedUrl} target="_blank">View file</a>
                                        <template lwc:if={canDeleteDocuments}>
                                            <lightning-button-icon
                                                icon-name="utility:delete"
                                                variant="bare"
                                                size="small"
                                                class="delete-icon"
                                                alternative-text="Delete Document"
                                                data-doccode={doc.docCode}
                                                onclick={handleImportantDocDelete}>
                                            </lightning-button-icon>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <template lwc:else>
                            <template lwc:if={isReadOnly}>
                                <div class="uploaded-box">
                                    <lightning-icon icon-name="utility:lock" size="small"></lightning-icon>
                                    <div class="uploaded-content">
                                        <span class="uploaded-text">Upload Signed {doc.name} — upload closed</span>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <h2 class="label">Upload Signed {doc.name}</h2>
                                <p class="message">PDF, JPG or PNG. Make sure the file is clearly named before uploading.</p>
                                <lightning-file-upload
                                    label="Upload Document"
                                    name={doc.docCode}
                                    accept=".pdf,.jpg,.jpeg,.png"
                                    record-id={applicationId}
                                    file-field-name={fileFieldName}
                                    data-doccode={doc.docCode}
                                    onuploadfinished={handleImportantDocUpload}>
                                </lightning-file-upload>
                            </template>
                        </template>
                    </div>
                </template>
            </div>

            <!-- ═══════════════════════════════════════════════════════════════
                 PAYMENT DETAILS
            ════════════════════════════════════════════════════════════════ -->
            <template lwc:if={showPaymentSection}>
                <div class="card payment-card">
                    <h2 class="label">Enter Payment Details</h2>

                    <template lwc:if={isPaymentSectionLocked}>
                        <div class="locked-message">
                            <lightning-icon icon-name="utility:lock" size="small" class="locked-icon"></lightning-icon>
                            <span>This section has been locked after final submission. No further changes can be made.</span>
                        </div>
                    </template>

                    <div class="payment-table-wrap">
                        <table class="payment-table">
                            <thead>
                                <tr>
                                    <th class="payment-th serial-col">#</th>
                                    <th class="payment-th">Application ID</th>
                                    <th class="payment-th">Date</th>
                                    <th class="payment-th">Amount</th>
                                    <th class="payment-th">Transaction ID</th>
                                    <th class="payment-th">Account Holder Name</th>
                                    <th class="payment-th">Account Number</th>
                                    <th class="payment-th">IFSC Code</th>
                                    <th class="payment-th">Name of the Bank</th>
                                    <th class="payment-th">Bank Branch</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={paymentRows} for:item="row">
                                    <tr key={row.rowId} class={row.rowClass}>
                                        <td class="payment-td serial-col">{row.displayIndex}</td>
                                        <td class="payment-td app-id-col">
                                            {row.applicationIdText}
                                        </td>
                                        <td class="payment-td">
                                            <lightning-input
                                                type="date"
                                                variant="label-hidden"
                                                label="Date"
                                                value={row.date}
                                                data-rowid={row.rowId}
                                                data-field="date"
                                                onchange={handlePaymentFieldChange}
                                                disabled={isPaymentSectionLocked}
                                                required>
                                            </lightning-input>
                                        </td>
                                        <td class="payment-td">
                                            <lightning-input
                                                type="number"
                                                variant="label-hidden"
                                                label="Amount"
                                                value={row.amount}
                                                formatter="currency"
                                                data-rowid={row.rowId}
                                                data-field="amount"
                                                onchange={handlePaymentFieldChange}
                                                max="9999999999999.99"
                                                step="0.01"
                                                disabled={isPaymentSectionLocked}
                                                required>
                                            </lightning-input>
                                        </td>
                                        <td class="payment-td">
                                            <lightning-input
                                                type="text"
                                                variant="label-hidden"
                                                label="Transaction ID"
                                                value={row.transactionId}
                                                data-rowid={row.rowId}
                                                data-field="transactionId"
                                                onchange={handlePaymentFieldChange}
                                                maxlength="255"
                                                disabled={isPaymentSectionLocked}
                                                required>
                                            </lightning-input>
                                        </td>
                                        <td class="payment-td">
                                            <lightning-input
                                                type="text"
                                                variant="label-hidden"
                                                label="Account Holder Name"
                                                value={row.accountHolderName}
                                                data-rowid={row.rowId}
                                                data-field="accountHolderName"
                                                onchange={handlePaymentFieldChange}
                                                maxlength="255"
                                                disabled={isPaymentSectionLocked}
                                                required>
                                            </lightning-input>
                                        </td>
                                        <td class="payment-td">
                                            <lightning-input
                                                type="text"
                                                variant="label-hidden"
                                                label="Account Number"
                                                value={row.accountNumber}
                                                data-rowid={row.rowId}
                                                data-field="accountNumber"
                                                onchange={handlePaymentFieldChange}
                                                maxlength="255"
                                                disabled={isPaymentSectionLocked}
                                                required>
                                            </lightning-input>
                                        </td>
                                        <td class="payment-td">
                                            <lightning-input
                                                type="text"
                                                variant="label-hidden"
                                                label="IFSC Code"
                                                value={row.ifscCode}
                                                data-rowid={row.rowId}
                                                data-field="ifscCode"
                                                onchange={handlePaymentFieldChange}
                                                maxlength="255"
                                                disabled={isPaymentSectionLocked}
                                                required>
                                            </lightning-input>
                                        </td>
                                        <td class="payment-td">
                                            <lightning-input
                                                type="text"
                                                variant="label-hidden"
                                                label="Name of the Bank"
                                                value={row.nameOfTheBank}
                                                data-rowid={row.rowId}
                                                data-field="nameOfTheBank"
                                                onchange={handlePaymentFieldChange}
                                                maxlength="255"
                                                disabled={isPaymentSectionLocked}
                                                required>
                                            </lightning-input>
                                        </td>
                                        <td class="payment-td">
                                            <lightning-input
                                                type="text"
                                                variant="label-hidden"
                                                label="Bank Branch"
                                                value={row.bankBranch}
                                                data-rowid={row.rowId}
                                                data-field="bankBranch"
                                                onchange={handlePaymentFieldChange}
                                                maxlength="255"
                                                disabled={isPaymentSectionLocked}
                                                required>
                                            </lightning-input>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- Row controls + Save + Final Submit -->
                    <div class="payment-actions">
                        <lightning-button
                            label="LESS"
                            icon-name="utility:dash"
                            variant="neutral"
                            class="payment-less-btn"
                            disabled={isLessDisabled}
                            onclick={handleRemovePaymentRow}>
                        </lightning-button>

                        <lightning-button
                            label="MORE"
                            icon-name="utility:add"
                            icon-position="right"
                            variant="neutral"
                            class="payment-more-btn"
                            disabled={isMoreDisabled}
                            onclick={handleAddPaymentRow}>
                        </lightning-button>
                    </div>

                    <div class="payment-submit-row">
                        <lightning-button
                            label="SAVE"
                            variant="neutral"
                            class="payment-save-btn"
                            disabled={isSaveDisabled}
                            onclick={handlePaymentSave}>
                        </lightning-button>
                        
                        <lightning-button
                            label="FINAL SUBMIT"
                            variant="brand"
                            class="payment-final-submit-btn"
                            disabled={isFinalSubmitDisabled}
                            onclick={handlePaymentFinalSubmit}>
                        </lightning-button>
                    </div>
                </div>
            </template>

            <!-- ═══════════════════════════════════════════════════════════════
                 T-SHIRT SIZE
            ════════════════════════════════════════════════════════════════ -->
            <template lwc:if={shouldShowTShirtSection}>
                <div class="card">
                    <h2 class="label">T-shirt size</h2>
                    <p class="message">Choose your size so we can prepare your welcome kit.</p>
                    <div class="tshirt-row">
                        <lightning-combobox
                            name="tshirtSize"
                            label="Size"
                            placeholder="Select a size"
                            value={tshirtSize}
                            options={tshirtSizeOptions}
                            onchange={handleShirtSizeChange}
                            disabled={isTShirtReadOnly}
                            class="tshirt-combobox">
                        </lightning-combobox>
                        <lightning-button
                            label="Save"
                            variant="brand"
                            icon-name="utility:save"
                            onclick={handleSaveTShirtSize}
                            disabled={isSaveTShirtDisabled}
                            class="tshirt-save-btn">
                        </lightning-button>
                    </div>
                    <template lwc:if={isReadOnly}>
                        <p class="locked-note">
                            <lightning-icon icon-name="utility:lock" size="xx-small" class="locked-icon">
                            </lightning-icon>
                            T-shirt size selection is locked after offer acceptance or withdrawal.
                        </p>
                    </template>
                    <template lwc:elseif={isTShirtReadOnly}>
                        <p class="locked-note">
                            <lightning-icon icon-name="utility:lock" size="xx-small" class="locked-icon">
                            </lightning-icon>
                            T-shirt size is locked after first save.
                        </p>
                    </template>
                </div>
            </template>

        </div>
    </template>

    <template lwc:else>
        <div class="loading-state">
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </div>
    </template>
</template>
