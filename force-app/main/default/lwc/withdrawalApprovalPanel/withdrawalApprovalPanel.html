<template>
    <template if:true={showPageButtons}>
        <div class="page-actions-wrapper">
            <div class="page-actions-card">
                <div class="slds-grid slds-grid_align-end slds-gutters_x-small page-actions-row">
                <template if:true={showApprove}>
                    <div class="slds-col slds-grow-none">
                        <lightning-button
                            variant="neutral"
                            label="Approve"
                            onclick={handleSelectApprove}
                            disabled={isLoading}>
                        </lightning-button>
                    </div>
                </template>
                <template if:true={showReject}>
                    <div class="slds-col slds-grow-none">
                        <lightning-button
                            variant="neutral"
                            label="Reject"
                            onclick={handleSelectReject}
                            disabled={isLoading}>
                        </lightning-button>
                    </div>
                </template>
                <template if:true={showRecall}>
                    <div class="slds-col slds-grow-none">
                        <lightning-button
                            variant="neutral"
                            label="Recalled"
                            onclick={handleSelectRecall}
                            disabled={isLoading}>
                        </lightning-button>
                    </div>
                </template>
                </div>
            </div>
        </div>
    </template>

    <template if:true={showActionPanel}>
        <lightning-card>
            <h2 slot="title" class="custom-title">{panelTitle}</h2>
            <div class="container">
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Processing"></lightning-spinner>
                </template>

                <template if:true={isApproveAction}>
                    <template if:true={showEscalateOption}>
                        <lightning-input
                            type="checkbox"
                            label="Send for Chairperson's second-level approval"
                            checked={escalateToChairperson}
                            onchange={handleEscalateChange}>
                        </lightning-input>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small slds-m-bottom_medium">
                            Leave unchecked to finalize this decision yourself. Check this box to send the
                            request to the Chairperson for final approval instead.
                        </p>
                    </template>

                    <lightning-textarea
                        label="Comments"
                        required
                        value={comments}
                        onchange={handleComments}>
                    </lightning-textarea>

                    <div class="button-container slds-text-align_right">
                        <lightning-button
                            label="Cancel"
                            onclick={handleCancelPanel}
                            disabled={isLoading}>
                        </lightning-button>
                        <lightning-button
                            class="slds-m-left_small"
                            variant="brand"
                            label="Submit"
                            onclick={handleSubmit}
                            disabled={isLoading}>
                        </lightning-button>
                    </div>
                </template>

                <template if:true={isRejectAction}>
                    <lightning-textarea
                        label="Rejection Comments"
                        required
                        value={comments}
                        onchange={handleComments}>
                    </lightning-textarea>

                    <div class="button-container slds-text-align_right">
                        <lightning-button
                            label="Cancel"
                            onclick={handleCancelPanel}
                            disabled={isLoading}>
                        </lightning-button>
                        <lightning-button
                            class="slds-m-left_small"
                            variant="destructive-text"
                            label="Reject"
                            onclick={handleSubmit}
                            disabled={isLoading}>
                        </lightning-button>
                    </div>
                </template>

                <template if:true={isRecallAction}>
                    <lightning-textarea
                        label="Recall Remarks"
                        required
                        value={comments}
                        onchange={handleComments}>
                    </lightning-textarea>

                    <div class="button-container slds-text-align_right">
                        <lightning-button
                            label="Cancel"
                            onclick={handleCancelPanel}
                            disabled={isLoading}>
                        </lightning-button>
                        <lightning-button
                            class="slds-m-left_small"
                            variant="brand"
                            label="Recalled"
                            onclick={handleSubmit}
                            disabled={isLoading}>
                        </lightning-button>
                    </div>
                </template>
            </div>
        </lightning-card>
    </template>
</template>
