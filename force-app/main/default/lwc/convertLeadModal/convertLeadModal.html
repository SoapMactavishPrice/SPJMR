<template>
    <lightning-modal-header label="Convert Lead"></lightning-modal-header>
    <lightning-modal-body>
        <lightning-radio-group
        label=""
        options={accountOptions}
        value={value}
        onchange={handleChangeRadio}
        type="radio"
    >
    </lightning-radio-group>
    <template lwc:if={boolean_newExisting}>
        <lightning-input label="Student Name" onchange={handleNameChange}></lightning-input>
    </template>
    <template lwc:else>
                <div class="slds-card slds-p-around_medium">
                <div class="slds-form-element">
                <div class="slds-form-element__control">
                    <lightning-input
                        label="Searchable Combobox"
                        onchange={search}
                        onfocus={showPickListOptions}
                        type="search"
                        value={selectedValue}
                    >
                    </lightning-input>

                <div 
                    if:true={searchResults}
                    class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid"
                    role="listbox"
                >
                    <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                        <template for:each={searchResults} for:item="searchResult">
                            <li 
                                key={searchResult.value} 
                                data-value={searchResult.value} 
                                role="presentation" 
                                onclick={selectSearchResult} 
                                class="slds-listbox__item"
                            >
                                <div 
                                    class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small" 
                                    role="option"
                                >
                                    <span class="slds-media__body">
                                        <span 
                                            class="slds-truncate" 
                                            title={searchResult.label}
                                        >
                                            {searchResult.label}
                                        </span>
                                    </span>
                                </div>
                            </li>
                        </template>
                    </ul>
                </div> 
            </div>
        </div>
    </div>
    </template>
</lightning-modal-body>
    <lightning-modal-footer>
    </lightning-modal-footer>
</template>
