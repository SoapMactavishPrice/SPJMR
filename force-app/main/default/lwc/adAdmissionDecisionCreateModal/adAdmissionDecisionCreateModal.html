<template>
    <lightning-modal-header label="Create Admission Decision">
    </lightning-modal-header>

    <lightning-modal-body>
        <lightning-record-edit-form
            object-api-name={objectApiName}
            onsubmit={handleSubmit}
            onsuccess={handleSuccess}>

            <!-- Application lookup -->
            <lightning-input-field
                field-name="Application__c"
                value={applicationId}>
            </lightning-input-field>

            <!-- Offer Letter Date -->
            <lightning-input-field
                field-name={offerDate}>
            </lightning-input-field>

            <!-- Result -->
            <lightning-input-field
                field-name={result}>
            </lightning-input-field>

            <!-- Specialisation (ONLY when NOT GMP) -->
            <template if:false={isGmp}>
                <lightning-input-field
                    field-name={specialisation}>
                </lightning-input-field>
            </template>

       

    
        <lightning-button
            label="Cancel"
            variant="neutral"
            onclick={close}>
        </lightning-button>

        <lightning-button
            label="Save"
            variant="brand"
            type="submit"
            class="slds-m-left_small">
        </lightning-button>
         </lightning-record-edit-form>
    </lightning-modal-body>
    
</template>
