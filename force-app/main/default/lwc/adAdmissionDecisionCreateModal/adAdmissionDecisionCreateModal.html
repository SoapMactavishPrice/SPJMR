<template>
    <lightning-modal-header label={modalLabel}>
    </lightning-modal-header>

    <lightning-modal-body>
        <lightning-record-edit-form
            object-api-name={objectApiName}
            record-id={admissionDecisionId}
            onsubmit={handleSubmit}
            onsuccess={handleSuccess}>

            <lightning-input-field
                field-name="Application__c"
                value={applicationId}>
            </lightning-input-field>

            <lightning-input-field
                field-name={result}
                onchange={handleResultChange}>
            </lightning-input-field>

            <template lwc:if={showSpecialization}>
                <lightning-input-field
                    field-name={specialisation}>
                </lightning-input-field>
            </template>

            <template lwc:if={isEligibleForAdmission}>
                <lightning-input-field
                    field-name={offerDate}
                    required>
                </lightning-input-field>

                <lightning-input-field
                    field-name={lastDateOfAcceptance}
                    required>
                </lightning-input-field>

                <lightning-input-field
                    field-name={signedLetterEta}
                    required>
                </lightning-input-field>

                <lightning-input-field
                    field-name={acceptanceFeeEta}
                    required>
                </lightning-input-field>

                <lightning-input-field
                    field-name={firstInstallmentEta}
                    required>
                </lightning-input-field>

                <lightning-input-field
                    field-name={balanceFeePaymentEta}
                    required>
                </lightning-input-field>
            </template>

            <template lwc:elseif={isWaitlisted}>
                <lightning-input-field
                    field-name={waitlistNumber}
                    required={waitlistNumberRequired}>
                </lightning-input-field>
            </template>

            <div class="slds-m-top_medium slds-text-align_right">
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={handleCancel}>
                </lightning-button>

                <lightning-button
                    label="Save"
                    variant="brand"
                    type="submit"
                    class="slds-m-left_small">
                </lightning-button>
            </div>
        </lightning-record-edit-form>
    </lightning-modal-body>
</template>
