<template>
    <div class="scoring-page slds-p-around_medium">

        <template if:true={bookingsLoading}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasFatalError}>
            <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                <h2>{displayErrorMessage}</h2>
            </div>
        </template>

        <template if:true={isEmpty}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <p class="slds-text-color_weak slds-text-heading_small">
                    No bookings found for this slot.
                </p>
            </div>
        </template>

        <template if:true={hasContent}>

            <div class="slds-m-bottom_medium">
                <!-- <c-ap-preview-pdf record-id={applicationId}></c-ap-preview-pdf> -->
            </div>

            <div class="table-scroll-wrapper slds-m-bottom_medium">
                <table class="scoring-table">

                    <thead>
                        <tr>
                            <th class="th-criteria-label" rowspan="2"></th>
                            <template for:each={applicantColumns} for:item="col">
                                <template if:true={showCriteriaComment}>
                                    <th key={col.key} class="th-applicant" colspan="2">{col.applicantName}</th>
                                </template>
                                <template if:false={showCriteriaComment}>
                                    <th key={col.key} class="th-applicant" colspan="1">{col.applicantName}</th>
                                </template>
                            </template>
                        </tr>
                        <tr>
                            <template for:each={applicantColumns} for:item="col">
                                <th key={col.scoreKey} class="th-subheader th-score-sub">Score</th>
                                <template if:true={showCriteriaComment}>
                                    <th key={col.commentKey} class="th-subheader th-comment-sub">Comment</th>
                                </template>
                            </template>
                        </tr>
                    </thead>

                    <tbody>
                        <template if:true={isDataLoading}>
                            <tr>
                                <td colspan="10" class="td-loading">
                                    <lightning-spinner alternative-text="Loading criteria" size="small"></lightning-spinner>
                                    &nbsp; Loading criteria…
                                </td>
                            </tr>
                        </template>

                        <template for:each={criteriaRows} for:item="row">
                            <tr key={row.key} class="criteria-row">

                                <td class="td-criteria-label">
                                    <span class="criteria-name">{row.criteriaName}</span>
                                    <span class="criteria-max">Max: {row.maxScore}</span>
                                </td>

                                <template for:each={row.cells} for:item="cell">
                                    <td key={cell.keyScore} class="td-score">
                                        <template if:false={cell.isFinished}>
                                            <lightning-input
                                                type="number"
                                                label=""
                                                variant="label-hidden"
                                                value={cell.score}
                                                min="1"
                                                max={row.maxScore}
                                                data-booking={cell.bookingId}
                                                data-crit={cell.critId}
                                                onchange={handleScoreChange}
                                                class="score-input">
                                            </lightning-input>
                                        </template>
                                        <template if:true={cell.isFinished}>
                                            <span class="readonly-score">{cell.score}</span>
                                        </template>
                                    </td>
                                    <template if:true={showCriteriaComment}>
                                        <td key={cell.keyComment} class="td-comment">
                                            <template if:false={cell.isFinished}>
                                                <lightning-input
                                                    type="text"
                                                    label=""
                                                    variant="label-hidden"
                                                    value={cell.comment}
                                                    placeholder="Add comment…"
                                                    data-booking={cell.bookingId}
                                                    data-crit={cell.critId}
                                                    onchange={handleCommentChange}
                                                    class="comment-input"
                                                    max-length="255" >
                                                </lightning-input>
                                            </template>
                                            <template if:true={cell.isFinished}>
                                                <span class="readonly-comment">{cell.comment}</span>
                                            </template>
                                        </td>
                                    </template>
                                </template>

                            </tr>
                        </template>

                        <tr class="eval-comment-row">
                            <td class="td-criteria-label eval-comment-label">
                                <span class="criteria-name">Overall Comment</span>
                            </td>
                            <template for:each={applicantColumns} for:item="col">
                                <template if:true={showCriteriaComment}>
                                    <td key={col.key} class="td-eval-comment" colspan="2">
                                        <template if:false={col.isFinished}>
                                            <lightning-textarea
                                                label=""
                                                variant="label-hidden"
                                                value={col.evalComment}
                                                placeholder="Enter your overall comment for this applicant…"
                                                max-length="1000"
                                                data-booking={col.bookingId}
                                                onchange={handleEvaluatorCommentChange}
                                                class="eval-textarea">
                                            </lightning-textarea>
                                        </template>
                                        <template if:true={col.isFinished}>
                                            <div class="readonly-eval-comment">{col.evalComment}</div>
                                        </template>
                                    </td>
                                </template>
                                <template if:false={showCriteriaComment}>
                                    <td key={col.key} class="td-eval-comment" colspan="1">
                                        <template if:false={col.isFinished}>
                                            <lightning-textarea
                                                label=""
                                                variant="label-hidden"
                                                value={col.evalComment}
                                                placeholder="Enter your overall comment for this applicant…"
                                                max-length="1000"
                                                data-booking={col.bookingId}
                                                onchange={handleEvaluatorCommentChange}
                                                class="eval-textarea">
                                            </lightning-textarea>
                                        </template>
                                        <template if:true={col.isFinished}>
                                            <div class="readonly-eval-comment">{col.evalComment}</div>
                                        </template>
                                    </td>
                                </template>
                            </template>
                        </tr>

                        <tr class="save-row">
                            <td class="td-criteria-label"></td>
                            <template for:each={applicantColumns} for:item="col">
                                <template if:true={showCriteriaComment}>
                                    <td key={col.key} class="td-save" colspan="2">
                                        <template if:false={col.isFinished}>
                                            <lightning-button
                                                label="Save Score"
                                                variant="brand"
                                                data-booking={col.bookingId}
                                                onclick={handleSaveScore}
                                                class="save-btn">
                                            </lightning-button>
                                        </template>
                                        <template if:true={col.isFinished}>
                                            <span class="saved-badge">&#10003; Saved</span>
                                        </template>
                                    </td>
                                </template>
                                <template if:false={showCriteriaComment}>
                                    <td key={col.key} class="td-save" colspan="1">
                                        <template if:false={col.isFinished}>
                                            <lightning-button
                                                label="Save Score"
                                                variant="brand"
                                                data-booking={col.bookingId}
                                                onclick={handleSaveScore}
                                                class="save-btn">
                                            </lightning-button>
                                        </template>
                                        <template if:true={col.isFinished}>
                                            <span class="saved-badge">&#10003; Saved</span>
                                        </template>
                                    </td>
                                </template>
                            </template>
                        </tr>

                    </tbody>
                </table>
            </div>

            <div class="slds-grid slds-grid_align-center slds-m-top_medium">
                <template if:true={isSaving}>
                    <lightning-spinner alternative-text="Completing…" size="small"></lightning-spinner>
                </template>
                <template if:false={isSaving}>
                    <lightning-button
                        label="Complete Interview"
                        variant="brand"
                        disabled={isCompleteDisabled}
                        onclick={handleFinish}
                        class="complete-btn">
                    </lightning-button>
                </template>
            </div>

        </template>

        <template if:true={showModal}>
            <div class="modal-backdrop">
                <div class="modal-box" role="dialog" aria-modal="true">

                    <div class="modal-header">
                        <span class="modal-icon">⚠️</span>
                        <h2 class="modal-title">Complete Interview?</h2>
                    </div>

                    <div class="modal-body">
                        <p>You are about to mark this interview as <strong>Complete</strong>.</p>
                        <p class="modal-warning">
                            Once completed, scores and comments become <strong>read-only</strong> and cannot be edited. Any unsaved scores will be saved automatically.
                        </p>
                        <p>Are you sure you want to proceed?</p>
                    </div>

                    <div class="modal-footer">
                        <lightning-button
                            label="Cancel"
                            variant="neutral"
                            onclick={handleCancelFinish}
                            class="slds-m-right_small">
                        </lightning-button>
                        <lightning-button
                            label="Yes, Complete Interview"
                            variant="brand"
                            onclick={handleConfirmFinish}>
                        </lightning-button>
                    </div>

                </div>
            </div>
        </template>

    </div>
</template>
