<template>
    <div class="container">

        <div class="page-header">
            <p class="eyebrow">Admissions</p>
            <h1 class="title">Offer and acceptance</h1>
        </div>

        <template lwc:if={isViewingAcceptance}>
            <div class="offer-card">
                <div class="back-btn-wrapper slds-p-bottom_small">
                    <lightning-button label="Back" icon-name="utility:back" variant="neutral"
                        onclick={handleBackToOffers} class="btn-back">
                    </lightning-button>
                </div>

                <div class="offer-header">
                    <div>
                        <div class="title-status-row">
                            <h2 class="offer-name">{activeOffer.ProgramName}</h2>
                            <div class="status-badge-group">
                                <span class="status-badge status-accepted">
                                    <lightning-icon icon-name="utility:check" size="xx-small" variant="success"></lightning-icon>
                                    Accepted
                                </span>
                                <template lwc:if={showActivePendingDocuments}>
                                    <span class="status-badge status-doc-pending">
                                        <lightning-icon icon-name="utility:warning" size="xx-small" variant="warning"></lightning-icon>
                                        Pending Documents
                                    </span>
                                </template>
                            </div>
                        </div>
                    </div>

                    <div class="offer-actions">
                        <template lwc:if={showActiveOfferDownload}>
                            <lightning-button label="Download offer" icon-name="utility:download" variant="neutral"
                                class="btn-download" data-id={activeOffer.offerLetterLink} onclick={handleDownload}>
                            </lightning-button>
                        </template>

                        <template lwc:if={activeOffer.isOfferAcceptedState}>
                                <template lwc:if={showActiveWithdraw}>
                                    <lightning-button label="Withdraw offer" icon-name="utility:undo" variant="destructive-text"
                                        data-id={activeOffer.applicationId} data-admid={activeOffer.admissionDecisionId}
                                        onclick={handleWithdraw}>
                                    </lightning-button>
                                </template>
                        </template>
                    </div>
                </div>

                <div class="offer-detail detail-page">
                    <c-ap-offer-acceptance-child admission-id={activeOffer.admissionDecisionId}
                        application-id={activeOffer.applicationId}
                        offer-letter-url={activeOffer.offerLetterLink}
                        is-offer-accepted-state={activeOffer.isOfferAcceptedState}
                        applicant-state-management={activeOffer.applicantStateManagement}
                        onupdateadmissionaccept={handleUpdateAdmissionAccept}
                        ondocstatuschange={handleDocStatusChange}>
                    </c-ap-offer-acceptance-child>
                </div>
            </div>
        </template>

        <template lwc:else>
        <template if:true={offers}>
            <template for:each={offers} for:item="offer">
                <div key={offer.admissionDecisionId} class="offer-card">

                    <div class="offer-header">
                        <div>
                            <p class="offer-eyebrow">Offer</p>
                            <p class="offer-name">{offer.ProgramName}</p>
                        </div>

                        <template lwc:if={offer.offerDeclined}>
                            <span class="status-badge status-declined">
                                <lightning-icon icon-name="utility:close" size="xx-small" variant="error"></lightning-icon>
                                Declined
                            </span>
                        </template>
                        <template lwc:elseif={offer.offerAccepted}>
                            <div class="status-badge-group">
                                <span class="status-badge status-accepted">
                                    <lightning-icon icon-name="utility:check" size="xx-small" variant="success"></lightning-icon>
                                    Accepted
                                </span>
                                <template lwc:if={offer.hasPendingDocuments}>
                                    <span class="status-badge status-doc-pending">
                                        <lightning-icon icon-name="utility:warning" size="xx-small" variant="warning"></lightning-icon>
                                        Pending Documents
                                    </span>
                                </template>
                            </div>
                        </template>
                        <template lwc:elseif={offer.isWithdrawDisabled}>
                            <span class="status-badge status-withdrawn">
                                Withdrawn
                            </span>
                        </template>
                        <template lwc:else>
                            <span class="status-badge status-pending">
                                Awaiting response
                            </span>
                        </template>
                    </div>

                    <div class="offer-actions">
                        <template lwc:if={offer.offerAccepted}>
                            <lightning-button label="View" icon-name="utility:preview" variant="brand"
                                data-admid={offer.admissionDecisionId} onclick={handleViewAcceptance}>
                            </lightning-button>
                        </template>

                        <template lwc:if={offer.showDownloadOffer}>
                            <lightning-button label="Download offer" icon-name="utility:download" variant="neutral"
                                class="btn-download" data-id={offer.offerLetterLink} onclick={handleDownload}>
                            </lightning-button>
                        </template>

                        <template lwc:if={offer.isOfferAcceptedState}>
                            <template lwc:if={offer.showWithdrawButton}>
                                <lightning-button label="Withdraw offer" icon-name="utility:undo" variant="destructive-text"
                                    data-id={offer.applicationId} data-admid={offer.admissionDecisionId}
                                    onclick={handleWithdraw}>
                                </lightning-button>
                            </template>
                        </template>

                        <template lwc:if={offer.showButtons}>
                            <lightning-button label="Accept" icon-name="utility:check" variant="success"
                                class="btn-accept" data-id={offer.applicationId} data-admid={offer.admissionDecisionId}
                                onclick={handleAccept} disabled={isDisabled}>
                            </lightning-button>

                            <lightning-button label="Decline" icon-name="utility:close" variant="destructive"
                                data-id={offer.applicationId} data-admid={offer.admissionDecisionId}
                                onclick={handleReject} disabled={isDisabled}>
                            </lightning-button>
                        </template>
                    </div>

                </div>
            </template>
        </template>

        <template if:false={offers}>
            <div class="empty-state">
                <p class="empty-title">No offers yet</p>
                <p class="empty-body">Offers will appear here as soon as they're issued.</p>
            </div>
        </template>
        </template>

    </div>

    <template lwc:if={showAcceptConfirm}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="accept-modal-heading"
            class="slds-modal slds-fade-in-open accept-modal">
            <div class="slds-modal__container">
                <header class="slds-modal__header accept-modal-header">
                    <h2 id="accept-modal-heading" class="slds-text-heading_medium">
                        Accept Offer
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <p>Are you sure you want to accept this offer?</p>
                </div>

                <footer class="slds-modal__footer">
                    <button type="button" class="slds-button slds-button_neutral" onclick={closeAcceptConfirm}>
                        Cancel
                    </button>
                    <button type="button" class="slds-button slds-button_brand" onclick={confirmAcceptOffer}>
                        Yes, I am
                    </button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
