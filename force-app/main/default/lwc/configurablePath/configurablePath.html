<template>
    <template if:true={hasLoadError}>
        <div class="slds-box slds-theme_error slds-m-bottom_small">
            <p class="slds-text-color_error">{loadErrorMessage}</p>
        </div>
    </template>

    <template if:true={showChrome}>
        <div class="path-shell slds-box slds-theme_default">
            <div class="path-toolbar slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <div class="path-col slds-col slds-grow">
                    <div class="path-scroll" role="region" aria-label="Status path">
                        <div class="path-row">
                            <template for:each={stagesView} for:item="st">
                                <button
                                    key={st.value}
                                    type="button"
                                    class={st.itemClass}
                                    data-value={st.value}
                                    title={st.label}
                                    onclick={handleStageClick}
                                >
                                    <span class="path-segment-label">{st.label}</span>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="path-actions slds-col slds-no-flex slds-m-left_small">
                    <lightning-button
                        variant="brand"
                        label="Mark Status as Complete"
                        onclick={handleOpenModal}
                        disabled={markCompleteDisabled}
                    ></lightning-button>
                </div>
            </div>
            <template if:true={saving}>
                <div class="slds-m-top_x-small slds-text-align_center saving-row">
                    <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
                    <span class="slds-m-left_x-small">Saving…</span>
                </div>
            </template>
        </div>
    </template>

    <template if:true={modalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close"
                        title="Close"
                        onclick={handleCloseModal}
                    >
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={modalLoadingOptions}>
                        <div class="slds-align_absolute-center slds-p-around_large">
                            <lightning-spinner alternative-text="Loading options" size="medium"></lightning-spinner>
                        </div>
                    </template>
                    <template if:false={modalLoadingOptions}>
                    <template if:true={showPathInModal}>
                        <lightning-input
                            label={pathModalLabel}
                            value={pathModalValue}
                            readonly
                            class="slds-m-bottom_small"
                        ></lightning-input>
                    </template>
                    <template if:true={modalUsePerProgram}>
                        <template for:each={modalProgramRows} for:item="block">
                            <div key={block.leadProgramId} class="slds-m-bottom_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_x-small">{block.sectionHeading}</h3>
                                <lightning-combobox
                                    data-lpid={block.leadProgramId}
                                    label="Sub-status"
                                    value={block.selectedValue}
                                    placeholder="Select a value"
                                    options={block.options}
                                    onchange={handlePerProgramComboChange}
                                ></lightning-combobox>
                            </div>
                        </template>
                    </template>
                    <template if:false={modalUsePerProgram}>
                    <template if:true={dependencyMulti}>
                        <lightning-dual-listbox
                            label={dependencyLabel}
                            source-label="Available"
                            selected-label="Selected"
                            options={dualListOptions}
                            value={modalDependencyValues}
                            onchange={handleDualChange}
                            disable-reordering
                        ></lightning-dual-listbox>
                    </template>
                    <template if:false={dependencyMulti}>
                        <lightning-combobox
                            name="dependency"
                            label={dependencyLabel}
                            value={modalDependencySingle}
                            placeholder="Select a value"
                            options={dualListOptions}
                            onchange={handleComboChange}
                        ></lightning-combobox>
                    </template>
                    </template>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button class="slds-m-right_x-small" label="Cancel" onclick={handleCloseModal}></lightning-button>
                    <lightning-button variant="brand" label="Done" onclick={handleSaveModal} disabled={saveModalDisabled}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
