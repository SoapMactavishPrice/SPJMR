<template>
    <template if:true={isEmailFound}>
        <template for:each={body} for:item='email'>
           <div key={email.Id} style="text-align:left; display:flex ; gap: 30px; ">
            <div class="timestamp">
              <p class = "timestamp-value">{email.Date}</p>
              <p class = "timestamp-value">{email.Time}</p>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; flex: 0 0 auto;">
                <div class="email-icon" onclick={showMailContents} data-id = {email.Id}>
                    <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 30C5.175 30 4.469 29.7065 3.882 29.1195C3.295 28.5325 3.001 27.826 3 27V9C3 8.175 3.294 7.469 3.882 6.882C4.47 6.295 5.176 6.001 6 6H30C30.825 6 31.5315 6.294 32.1195 6.882C32.7075 7.47 33.001 8.176 33 9V27C33 27.825 32.7065 28.5315 32.1195 29.1195C31.5325 29.7075 30.826 30.001 30 30H6ZM18 19.5L6 12V27H30V12L18 19.5ZM18 16.5L30 9H6L18 16.5ZM6 12V9V27V12Z" fill="white"/>
                    </svg>
                </div>
                <div class="black-line"></div>
            </div>
            <div class="subject">
                Email Having Subject line: {email.Subject}
            </div>
            
           </div>
        </template>
    </template>
    <div class="no-email" if:false={isEmailFound}>You do not have any emails!</div>
                
</template>
