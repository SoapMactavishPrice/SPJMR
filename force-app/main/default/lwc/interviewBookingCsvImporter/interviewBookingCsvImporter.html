<template>
    <lightning-card title="Interview Booking CSV Import">
        <lightning-button slot="actions" label="Download Sample Header" icon-name="utility:download"
            onclick={downloadSampleHeader} disabled={isImportTypeUnselected}>
        </lightning-button>
        <lightning-button slot="actions" label="Download Column Instructions" icon-name="utility:info"
            onclick={downloadColumnInstructions} disabled={isImportTypeUnselected} style="margin-left:8px;">
        </lightning-button>

        <div class="slds-p-around_medium">
            <a class="slds-hide" data-id="sample-download"></a>
            <lightning-radio-group name="importType" label="Import Type" options={importOptions} value={importType}
                type="button" onchange={handleImportTypeChange}>
            </lightning-radio-group>

            <template if:true={showImportForm}>
                <template if:true={requiresProgram}>
                    <div class="slds-m-top_medium">
                        <lightning-record-picker label="Program" object-api-name="Program" placeholder="Search programs..."
                            onchange={handleProgramChange} required>
                        </lightning-record-picker>
                    </div>
                </template>

                <div class="guidance slds-text-body_small slds-m-top_medium" role="note">
                    <strong>Required headers:</strong> {requiredHeaders}. Header names must match exactly and can be in any order.
                    Additional columns are ignored.
                </div>

                <lightning-input class="slds-m-top_medium" type="file" label="Upload CSV File" accept=".csv"
                    onchange={handleFileUpload} disabled={isLoading}>
                </lightning-input>
                <p class="slds-text-body_small slds-text-color_weak">Upload files smaller than 9 MB.</p>

                <template if:true={fileName}>
                    <p class="slds-m-top_small"><strong>Selected file:</strong> {fileName}</p>
                </template>

                <div class="slds-m-top_medium">
                    <!-- <template if:true={showNotifyApplicants}>
                        <lightning-input type="checkbox" label="Notify Applicants" checked={notifyApplicants}
                            onchange={handleCheckboxChange} data-field="notifyApplicants">
                        </lightning-input>
                    </template>
                    <template if:true={showNotifyInterviewers}>
                        <lightning-input type="checkbox" label="Notify Interviewers" checked={notifyInterviewers}
                            onchange={handleCheckboxChange} data-field="notifyInterviewers">
                        </lightning-input>
                    </template> -->
                    <lightning-input type="checkbox" label="Email Success/Error CSV" checked={emailReports}
                        onchange={handleCheckboxChange} data-field="emailReports">
                    </lightning-input>
                </div>

                <lightning-button class="slds-m-top_medium" label="Start Import" variant="brand"
                    onclick={startImport} disabled={isStartDisabled}>
                </lightning-button>
            </template>

            <template if:true={isLoading}>
                <div class="slds-m-top_medium"><lightning-spinner alternative-text="Processing CSV"></lightning-spinner></div>
            </template>

            <template if:true={successFiles.length}>
                <div class="slds-m-top_medium">
                    <h3 class="slds-text-heading_small">Success CSV Files</h3>
                    <template for:each={successFiles} for:item="file">
                        <p key={file.documentId} class="slds-m-top_x-small">
                            <a href={file.url} target="_blank">{file.name}</a>
                        </p>
                    </template>
                </div>
            </template>

            <template if:true={errorFiles.length}>
                <div class="slds-m-top_medium">
                    <h3 class="slds-text-heading_small">Error CSV Files</h3>
                    <template for:each={errorFiles} for:item="file">
                        <p key={file.documentId} class="slds-m-top_x-small">
                            <a href={file.url} target="_blank">{file.name}</a>
                        </p>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
