<template>
    <div class="table-wrapper">
        <table class="custom-table">
            <thead>
                <tr>
                    <th>Slot Code</th>
                    <th>Slot Date</th>
                    <th>Slot Start Time</th>
                    <th>Slot End Time</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Mode</th>
                </tr>
            </thead>
            <tbody>
                <template for:each={data} for:item="row">
                    <tr key={row.slotId}>
                        <td>
                            <a data-id={row.slotId} onclick={handleSlotClick}>
                                {row.slotCode}
                            </a>
                        </td>
                        <td>{row.slotDate}</td>
                        <td>{row.startTime}</td>
                        <td>{row.endTime}</td>
                        <td>{row.location}</td>
                        <td>{row.status}</td>
                        <td>{row.mode}</td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</template>
