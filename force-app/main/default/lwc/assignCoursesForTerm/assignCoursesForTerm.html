<template>
    <template lwc:if={showModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large" 
                 aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" 
                            title="Close" onclick={handleClose}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Assign Courses to Term</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <p class="slds-m-bottom_medium">
                        Select courses and provide Start Date, End Date, and Evaluation Term. 
                        Click Save to create Course Offering records.
                    </p>
                    
                    <template lwc:if={isLoading}>
                        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    </template>
                    
                    <template lwc:else>
                        <div class="slds-m-bottom_medium">
                            <lightning-input
                                type="search"
                                label="Search Courses"
                                value={searchKey}
                                onchange={handleSearchChange}
                                placeholder="Search by course name or number..."
                                class="slds-m-bottom_small">
                            </lightning-input>
                        </div>
                        
                        <div class="slds-scrollable_x">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col" style="width: 80px;">
                                            <div class="slds-truncate" title="Select">Select</div>
                                        </th>
                                        <th scope="col" style="width: 50px;">
                                            <div class="slds-truncate" title="#">#</div>
                                        </th>
                                        <th scope="col">
                                            <div class="slds-truncate" title="Course Name">Course Name</div>
                                        </th>
                                        <th scope="col">
                                            <div class="slds-truncate" title="Course Number">Course Number</div>
                                        </th>
                                        <th scope="col">
                                            <div class="slds-truncate" title="Start Date">Start Date</div>
                                        </th>
                                        <th scope="col">
                                            <div class="slds-truncate" title="End Date">End Date</div>
                                        </th>
                                        <th scope="col">
                                            <div class="slds-truncate" title="Evaluation Term">Evaluation Term</div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template lwc:if={filteredCourses}>
                                        <template for:each={filteredCourses} for:item="course" for:index="index">
                                            <tr key={course.programCourseId} class="slds-hint-parent">
                                                <td>
                                                    <lightning-input
                                                        type="checkbox"
                                                        checked={course.selected}
                                                        data-course-id={course.programCourseId}
                                                        onchange={handleSelectChange}>
                                                    </lightning-input>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate">{course.rowNumber}</div>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate" title={course.courseName}>{course.courseName}</div>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate" title={course.courseNumber}>{course.courseNumber}</div>
                                                </td>
                                                <td>
                                                    <lightning-input
                                                        type="date"
                                                        value={course.startDate}
                                                        data-course-id={course.programCourseId}
                                                        onchange={handleStartDateChange}
                                                        disabled={course.isDisabled}
                                                        class="slds-m-vertical_x-small">
                                                    </lightning-input>
                                                </td>
                                                <td>
                                                    <lightning-input
                                                        type="date"
                                                        value={course.endDate}
                                                        data-course-id={course.programCourseId}
                                                        onchange={handleEndDateChange}
                                                        disabled={course.isDisabled}
                                                        class="slds-m-vertical_x-small">
                                                    </lightning-input>
                                                </td>
                                                <td>
                                                    <lightning-combobox
                                                        value={course.evaluationTermId}
                                                        options={evaluationTerms}
                                                        data-course-id={course.programCourseId}
                                                        onchange={handleEvaluationTermChange}
                                                        disabled={course.isDisabled}
                                                        placeholder="Select Evaluation Term"
                                                        class="slds-m-vertical_x-small">
                                                    </lightning-combobox>
                                                </td>
                                            </tr>
                                        </template>
                                    </template>
                                    <template lwc:else>
                                        <tr>
                                            <td colspan="7" class="slds-text-align_center slds-p-vertical_large">
                                                <p class="slds-text-heading_medium">No courses available</p>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        variant="neutral"
                        onclick={handleCancel}
                        class="slds-m-right_small">
                    </lightning-button>
                    <lightning-button
                        label="Save"
                        variant="brand"
                        onclick={handleSave}
                        disabled={isLoading}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
