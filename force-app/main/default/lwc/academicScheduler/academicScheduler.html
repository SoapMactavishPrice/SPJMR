<template>
    <div class="scheduler-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Logo/Brand -->
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
                        <path d="M3 10H21" stroke="currentColor" stroke-width="2"/>
                        <path d="M8 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M16 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <span class="brand-text">Academia</span>
            </div>

            <!-- New Booking Button -->
            <button class="new-booking-btn" onclick={handleNewBooking}>
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                New Booking
            </button>

            <!-- Filters Section -->
            <div class="filters-section">
                <div class="filters-header">
                    <span class="filters-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 3H2L10 12.46V19L14 21V12.46L22 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span class="filters-title">STRUCTURE FILTERS</span>
                    <button class="reset-btn" onclick={handleResetFilters}>
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 4V10H7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M3.51 15C4.15 16.88 5.38 18.49 7.01 19.55C8.64 20.61 10.58 21.05 12.5 20.79C14.42 20.53 16.21 19.59 17.54 18.14C18.87 16.69 19.68 14.82 19.83 12.84C19.98 10.86 19.46 8.88 18.35 7.23C17.24 5.58 15.6 4.35 13.72 3.75C11.84 3.14 9.81 3.19 7.96 3.89C6.11 4.59 4.54 5.9 3.51 7.59" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Reset
                    </button>
                </div>

                <!-- Program Filter -->
                <div class="filter-group">
                    <label class="filter-label">Programme</label>
                    <lightning-combobox
                        name="program"
                        value={selectedProgram}
                        placeholder="All Programs"
                        options={programs}
                        onchange={handleFilterChange}
                        data-field="program"
                        variant="label-hidden">
                    </lightning-combobox>
                </div>

                <!-- Batch Filter -->
                <div class="filter-group">
                    <label class="filter-label">Batch</label>
                    <lightning-combobox
                        name="batch"
                        value={selectedBatch}
                        placeholder="All Batches"
                        options={batches}
                        onchange={handleFilterChange}
                        data-field="batch"
                        variant="label-hidden">
                    </lightning-combobox>
                </div>

                <!-- Batch Group Filter -->
                <div class="filter-group">
                    <label class="filter-label">Batch Group</label>
                    <lightning-combobox
                        name="batchGroup"
                        value={selectedBatchGroup}
                        placeholder="All Groups"
                        options={batchGroups}
                        onchange={handleFilterChange}
                        data-field="batchGroup"
                        variant="label-hidden">
                    </lightning-combobox>
                </div>

                <!-- Term Filter -->
                <div class="filter-group">
                    <label class="filter-label">Term</label>
                    <lightning-combobox
                        name="term"
                        value={selectedTerm}
                        placeholder="All Terms"
                        options={terms}
                        onchange={handleFilterChange}
                        data-field="term"
                        variant="label-hidden">
                    </lightning-combobox>
                </div>

                <!-- Division Filter -->
                <div class="filter-group">
                    <label class="filter-label">Division</label>
                    <lightning-combobox
                        name="division"
                        value={selectedDivision}
                        placeholder="All Divisions"
                        options={divisions}
                        onchange={handleFilterChange}
                        data-field="division"
                        variant="label-hidden">
                    </lightning-combobox>
                </div>
            </div>

            <!-- Footer -->
            <div class="sidebar-footer">
                Academic Scheduler v1.2
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="calendar-header">
                <div class="header-left">
                    <!-- Navigation -->
                    <div class="nav-controls">
                        <button class="nav-btn" onclick={handlePrevious}>
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                        <button class="today-btn" onclick={handleToday}>Today</button>
                        <button class="nav-btn" onclick={handleNext}>
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                    
                    <!-- Current Period -->
                    <h1 class="header-title">{headerTitle}</h1>
                </div>

                <div class="header-right">
                    <!-- View Toggles -->
                    <div class="view-toggles">
                        <button class={monthViewClass} data-view="month" onclick={handleViewChange}>Month</button>
                        <button class={weekViewClass} data-view="week" onclick={handleViewChange}>Week</button>
                        <button class={dayViewClass} data-view="day" onclick={handleViewChange}>Day (Division)</button>
                    </div>
                </div>
            </header>

            <!-- Calendar Content -->
            <div class="calendar-content">
                <!-- Week View - Time Vertical -->
                <template if:true={isWeekView}>
                    <div class="week-view-vertical">
                        <div class="week-grid">
                            <!-- Header Row with Days -->
                            <div class="week-header">
                                <div class="time-column-header">TIME</div>
                                <template for:each={weekDays} for:item="day">
                                    <div key={day.id} class={day.headerClass}>
                                        <span class="day-name">{day.name}</span>
                                        <span class="day-date">{day.date}</span>
                                    </div>
                                </template>
                            </div>
                            <!-- Time Rows -->
                            <div class="week-body">
                                <template for:each={weekViewData} for:item="row">
                                    <div key={row.hour.id} class="time-row">
                                        <div class="time-label">{row.hour.label}</div>
                                        <template for:each={row.days} for:item="dayCell">
                                            <div key={dayCell.id} 
                                                 class="week-cell"
                                                 data-date={dayCell.dateString}
                                                 data-hour={row.hour.value}
                                                 onclick={handleSlotClick}>
                                                <template if:true={dayCell.hasSessions}>
                                                    <template for:each={dayCell.sessions} for:item="session">
                                                        <div key={session.id} 
                                                             class="week-session-card" 
                                                             style={session.style}
                                                             data-session-id={session.id}
                                                             onclick={handleSessionClick}>
                                                            <span class="session-code">{session.courseCode}</span>
                                                            <span class="session-div">{session.displayDivision}</span>
                                                        </div>
                                                    </template>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Day View - Time Vertical -->
                <template if:true={isDayView}>
                    <div class="day-view-vertical">
                        <div class="day-grid">
                            <!-- Header Row with Divisions -->
                            <div class="day-header-row">
                                <div class="time-column-header">TIME</div>
                                <template for:each={divisionRows} for:item="division">
                                    <div key={division.id} class="division-column-header">
                                        <span class="division-name">{division.name}</span>
                                        <span class="division-term">{division.term}</span>
                                    </div>
                                </template>
                            </div>
                            <!-- Time Rows -->
                            <div class="day-body">
                                <template for:each={dayViewData} for:item="row">
                                    <div key={row.hour.id} class="time-row">
                                        <div class="time-label">{row.hour.label}</div>
                                        <template for:each={row.divisions} for:item="divCell">
                                            <div key={divCell.division.id} 
                                                 class="day-cell-vertical"
                                                 data-date={divCell.division.id}
                                                 data-division={divCell.division.id}
                                                 data-hour={row.hour.value}
                                                 onclick={handleSlotClick}>
                                                <template if:true={divCell.hasSession}>
                                                    <div class="day-session-card-vertical" 
                                                         style={divCell.session.style}
                                                         data-session-id={divCell.session.id}
                                                         onclick={handleSessionClick}>
                                                        <span class="session-code">{divCell.session.displayCode}</span>
                                                        <span class="session-title">{divCell.session.displayTitle}</span>
                                                        <span class="session-faculty">{divCell.session.displayFaculty}</span>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Month View -->
                <template if:true={isMonthView}>
                    <div class="month-view">
                        <div class="month-header-row">
                            <div class="month-day-header">SUN</div>
                            <div class="month-day-header">MON</div>
                            <div class="month-day-header">TUE</div>
                            <div class="month-day-header">WED</div>
                            <div class="month-day-header">THU</div>
                            <div class="month-day-header">FRI</div>
                            <div class="month-day-header">SAT</div>
                        </div>
                        <template for:each={monthCalendarWeeks} for:item="week">
                            <div key={week.id} class="month-week-row">
                                <template for:each={week.days} for:item="day">
                                    <div key={day.id} 
                                         class={day.dayClass}
                                         data-date={day.dateString}
                                         onclick={handleSlotClick}>
                                        <span class="month-day-number">{day.date}</span>
                                        <div class="month-sessions">
                                            <template for:each={day.sessions} for:item="session">
                                                <div key={session.id} 
                                                     class="month-session-item"
                                                     style={session.style}
                                                     data-session-id={session.id}
                                                     onclick={handleSessionClick}>
                                                    {session.displayText}
                                                </div>
                                            </template>
                                            <template if:true={day.hasMore}>
                                                <div class="month-more-sessions">+{day.moreCount} more</div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Floating Navigation Button -->
            <button class="floating-nav-btn right" onclick={handleNext}>
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </main>
    </div>

    <!-- Modal -->
    <template if:true={isModalOpen}>
        <div class="modal-overlay" onclick={handleCloseModal}>
            <div class="modal-container" onclick={stopModalPropagation}>
                <!-- Modal Header -->
                <div class="modal-header">
                    <div class="modal-header-left">
                        <div class="modal-icon">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
                                <path d="M3 10H21" stroke="currentColor" stroke-width="2"/>
                                <path d="M8 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M16 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="modal-header-text">
                            <h2 class="modal-title">{modalTitle}</h2>
                            <p class="modal-subtitle">{modalSubtitle}</p>
                        </div>
                    </div>
                    <button class="modal-close-btn" onclick={handleCloseModal}>
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body-new">
                    <!-- Top Section - Context & Class Details (Horizontal) -->
                    <div class="modal-top-section">
                        <!-- Context Section -->
                        <div class="context-card">
                            <div class="card-header">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                                    <path d="M12 16V12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                    <circle cx="12" cy="8" r="1" fill="currentColor"/>
                                </svg>
                                <span>CONTEXT</span>
                            </div>
                            <div class="card-body">
                                <div class="inline-form-group">
                                    <label class="inline-label">Program</label>
                                    <lightning-combobox
                                        name="modalProgram"
                                        value={modalData.program}
                                        options={programs}
                                        onchange={handleModalInputChange}
                                        data-field="program"
                                        variant="label-hidden">
                                    </lightning-combobox>
                                </div>
                                <div class="inline-form-group">
                                    <label class="inline-label">Batch</label>
                                    <lightning-combobox
                                        name="modalBatch"
                                        value={modalData.batch}
                                        options={batches}
                                        onchange={handleModalInputChange}
                                        data-field="batch"
                                        variant="label-hidden">
                                    </lightning-combobox>
                                </div>
                                <div class="inline-form-group">
                                    <label class="inline-label">Term</label>
                                    <lightning-combobox
                                        name="modalTerm"
                                        value={modalData.term}
                                        options={terms}
                                        onchange={handleModalInputChange}
                                        data-field="term"
                                        variant="label-hidden">
                                    </lightning-combobox>
                                </div>
                            </div>
                        </div>

                        <!-- Class Details Section -->
                        <div class="context-card">
                            <div class="card-header">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                                    <path d="M12 8V16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                    <path d="M8 12H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                                <span>CLASS DETAILS</span>
                            </div>
                            <div class="card-body">
                                <div class="inline-form-group">
                                    <label class="inline-label">Course</label>
                                    <lightning-combobox
                                        name="modalCourse"
                                        value={modalData.course}
                                        options={courses}
                                        onchange={handleModalInputChange}
                                        data-field="course"
                                        variant="label-hidden">
                                    </lightning-combobox>
                                </div>
                                <div class="inline-form-group">
                                    <label class="inline-label">Session Title</label>
                                    <lightning-input
                                        type="text"
                                        value={modalData.sessionTitle}
                                        onchange={handleModalInputChange}
                                        data-field="sessionTitle"
                                        variant="label-hidden">
                                    </lightning-input>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Bottom Section - Full Width Session Timeline -->
                    <div class="modal-bottom-section">
                        <!-- Session Timeline - Full Width -->
                        <div class="timeline-column-full">
                        <div class="timeline-header">
                            <h3 class="timeline-title">Session Timeline</h3>
                            <button class="add-session-btn" onclick={handleAddSession}>
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                                Add Another Session
                            </button>
                        </div>

                        <!-- Sessions Table -->
                        <div class="sessions-table-container">
                            <table class="sessions-table">
                                <thead>
                                    <tr>
                                        <th class="select-col"></th>
                                        <th>DIVISION</th>
                                        <th>DATE</th>
                                        <th>TIME</th>
                                        <th>DUR (MIN)</th>
                                        <th>FACULTY</th>
                                        <th>PROGRAMS</th>
                                        <th>ACTION</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={modalSessionRows} for:item="session">
                                        <tr key={session.id} class={session.rowClass} data-index={session.index} onclick={handleSelectSessionRow}>
                                            <td class="select-col">
                                                <div class="row-indicator"></div>
                                            </td>
                                            <td>
                                                <lightning-combobox
                                                    name="sessionDivision"
                                                    value={session.division}
                                                    options={session.divisionOptions}
                                                    onchange={handleSessionFieldChange}
                                                    data-index={session.index}
                                                    data-field="divisionId"
                                                    variant="label-hidden">
                                                </lightning-combobox>
                                            </td>
                                            <td>
                                                <lightning-input
                                                    type="date"
                                                    value={session.date}
                                                    onchange={handleSessionFieldChange}
                                                    data-index={session.index}
                                                    data-field="date"
                                                    variant="label-hidden">
                                                </lightning-input>
                                            </td>
                                            <td>
                                                <lightning-input
                                                    type="time"
                                                    value={session.time}
                                                    onchange={handleSessionFieldChange}
                                                    data-index={session.index}
                                                    data-field="time"
                                                    variant="label-hidden">
                                                </lightning-input>
                                            </td>
                                            <td>
                                                <lightning-input
                                                    type="number"
                                                    value={session.duration}
                                                    min="15"
                                                    max="180"
                                                    step="15"
                                                    onchange={handleSessionFieldChange}
                                                    data-index={session.index}
                                                    data-field="duration"
                                                    variant="label-hidden">
                                                </lightning-input>
                                            </td>
                                            <td>
                                                <div class="faculty-cell">
                                                    <div class="faculty-pills">
                                                        <template for:each={session.facultyPills} for:item="faculty">
                                                            <span key={faculty.value} class="faculty-pill">
                                                                {faculty.label}
                                                                <button class="pill-remove" 
                                                                        data-session-index={faculty.sessionIndex}
                                                                        data-faculty={faculty.value}
                                                                        onclick={handleRemoveFaculty}>×</button>
                                                            </span>
                                                        </template>
                                                    </div>
                                                    <lightning-combobox
                                                        name="sessionFaculty"
                                                        placeholder={session.facultyPlaceholder}
                                                        options={session.facultyOptions}
                                                        onchange={handleFacultyChange}
                                                        data-index={session.index}
                                                        value=""
                                                        variant="label-hidden">
                                                    </lightning-combobox>
                                                </div>
                                            </td>
                                            <td>
                                                <span class="selection-badge">{session.selectionCount} selected</span>
                                            </td>
                                            <td>
                                                <button class="delete-session-btn" 
                                                        data-index={session.index}
                                                        onclick={handleDeleteSession}>
                                                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                        <path d="M3 6H5H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                                        <path d="M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6H19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                                    </svg>
                                                </button>
                                            </td>
                                        </tr>
                                        <!-- Expandable Program Selection Row -->
                                        <tr key={session.expandableKey} class="session-expandable-row" data-session-index={session.index}>
                                            <td colspan="8" class="expandable-cell">
                                                <div class="session-program-selection">
                                                    <div class="program-selection-header">
                                                        <button class="toggle-expand-btn" 
                                                                data-index={session.index}
                                                                onclick={handleToggleSessionRow}>
                                                            <svg class={session.expandedClass} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                                <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                                            </svg>
                                                            <span>Select Program, Batch, Batch Group, and Divisions</span>
                                                            <span class="selection-count-badge">{session.selectedAssignments.length} selected</span>
                                                        </button>
                                                    </div>
                                                    <template if:true={session.isExpanded}>
                                                        <template if:true={session.division}>
                                                            <template if:true={session.courseAssignments.length}>
                                                                <div class="selection-table-container-inline">
                                                                    <table class="selection-table">
                                                                        <thead>
                                                                            <tr>
                                                                                <th class="checkbox-col">
                                                                                    <input type="checkbox" 
                                                                                           checked={session.allAssignmentsSelected}
                                                                                           onchange={handleSelectAllSessionAssignments}
                                                                                           data-session-index={session.index}
                                                                                           class="select-all-checkbox"
                                                                                           title="Select All"/>
                                                                                </th>
                                                                                <th>Program</th>
                                                                                <th>Batch</th>
                                                                                <th>Batch Group</th>
                                                                                <th>Divisions</th>
                                                                                <th>Term / Academic Year</th>
                                                                            </tr>
                                                                        </thead>
                                                                        <tbody>
                                                                            <template for:each={session.courseAssignments} for:item="assignment">
                                                                                <tr key={assignment.assignmentKey}>
                                                                                    <td class="checkbox-col">
                                                                                        <input type="checkbox" 
                                                                                               data-key={assignment.assignmentKey}
                                                                                               data-session-index={session.index}
                                                                                               checked={assignment.isSelected}
                                                                                               onchange={handleSessionAssignmentToggle}
                                                                                               class="program-checkbox"/>
                                                                                    </td>
                                                                                    <td class="program-cell">
                                                                                        <div class="program-info">
                                                                                            <div class="program-name">{assignment.programName}</div>
                                                                                        </div>
                                                                                    </td>
                                                                                    <td>
                                                                                        <div class="batch-info">{assignment.batchName}</div>
                                                                                    </td>
                                                                                    <td>
                                                                                        <div class="batch-group-info">{assignment.batchGroupName}</div>
                                                                                    </td>
                                                                                    <td>
                                                                                        <div class="division-info">
                                                                                            <span class="division-badge">{assignment.divisionName}</span>
                                                                                        </div>
                                                                                    </td>
                                                                                    <td>
                                                                                        <div class="term-info">{assignment.termName}</div>
                                                                                    </td>
                                                                                </tr>
                                                                            </template>
                                                                        </tbody>
                                                                    </table>
                                                                </div>
                                                            </template>
                                                            <template if:false={session.courseAssignments.length}>
                                                                <div class="selection-placeholder-inline">
                                                                    <p class="placeholder-text">Select a course to view available program assignments</p>
                                                                </div>
                                                            </template>
                                                        </template>
                                                        <template if:false={session.division}>
                                                            <div class="selection-placeholder-inline">
                                                                <p class="placeholder-text">Please select a division first</p>
                                                            </div>
                                                        </template>
                                                    </template>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    </div>
                </div>

                <!-- Modal Footer -->
                <div class="modal-footer">
                    <div class="footer-info">
                        <span>{sessionCount} sessions scheduled</span>
                        <span class={conflictInfoClass}>
                            • {conflictCount} conflicts detected
                        </span>
                    </div>
                    <div class="footer-actions">
                        <button class="btn-cancel" onclick={handleCloseModal}>Cancel</button>
                        <button class="btn-save" onclick={handleSaveSession}>
                            <template if:true={isEditMode}>Update Session</template>
                            <template if:false={isEditMode}>Create Session</template>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>
</template>
