                                        disabled={isEditSessionReadOnly}>
                                    </lightning-combobox>
                                    <template if:true={editSessionFieldErrors.startTimeError}>
                                        <div class="field-inline-error">{editSessionFieldErrors.startTimeError}</div>
                                    </template>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <div class="form-group">
                                    <label for="endTime">End Time <span class="required">*</span></label>
                                    <lightning-combobox
                                        id="endTime"
                                        value={eventEndTime}
                                        options={editSessionTimeOptions}
                                        placeholder="Select end time"
                                        onchange={handleEndTimeChange}
                                        variant="label-hidden"
                                        disabled={isEditSessionReadOnly}>
                                    </lightning-combobox>
                                    <template if:true={editSessionFieldErrors.endTimeError}>
                                        <div class="field-inline-error">{editSessionFieldErrors.endTimeError}</div>
                                    </template>
                                    <template if:true={editSessionFieldErrors.orderError}>
                                        <div class="field-inline-error">{editSessionFieldErrors.orderError}</div>
                                    </template>
                                </div>
                            </div>
                        </div>
                        <!-- Row 6: Class Room (1/3), Remark (1/3), URL (1/3) - all optional -->
                        <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_small">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <div class="form-group">
                                    <label for="eventClassRoom">Class Room</label>
                                    <lightning-input

        <template if:true={showStudentConflictsModal}>
            <div class="conflicts-modal-overlay" onclick={handleCloseStudentConflictsModal}>
                <div class="conflicts-modal-content conflicts-modal-content-redesign" onclick={handleModalClick}>
                    <div class="conflicts-modal-header">
                        <div class="conflicts-modal-header-icon" aria-hidden="true">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                                <line x1="12" y1="9" x2="12" y2="13"></line>
                                <line x1="12" y1="17" x2="12.01" y2="17"></line>
                            </svg>
                        </div>
                        <h3 class="conflicts-modal-title">Students have overlapping sessions</h3>
                        <button type="button" class="close-btn" onclick={handleCloseStudentConflictsModal} aria-label="Close">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="conflicts-modal-body">
                        <p class="conflicts-modal-intro">One or more students are already enrolled in another session at the same date and time. Please adjust the schedule or division to avoid conflicts.</p>
                        <div class="conflicts-cards">
                            <template for:each={studentConflictsWithDisplay} for:item="conflict">
                                <article key={conflict.conflictKey} class="conflict-card">
                                    <div class="conflict-card-label conflict-card-label-faculty">Student(s) in conflict</div>
                                    <div class="conflict-card-value conflict-card-faculty-names">{conflict.studentNamesStr}</div>
                                    <div class="conflict-card-row">
                                        <div class="conflict-card-half">
                                            <div class="conflict-card-label">Your session</div>
                                            <div class="conflict-card-session-name">{conflict.proposedSessionName}</div>
                                            <div class="conflict-card-meta">{conflict.proposedDateStr} · {conflict.proposedTimeStr}</div>
                                        </div>
                                        <div class="conflict-card-half conflict-card-half-conflicting">
                                            <div class="conflict-card-label">Conflicting session</div>
                                            <div class="conflict-card-session-name">{conflict.conflictingSessionName}</div>
                                            <template if:true={conflict.conflictingCourseName}>
                                                <div class="conflict-card-context-line"><span class="conflict-context-label">Course:</span> {conflict.conflictingCourseName}</div>
                                            </template>
                                            <div class="conflict-card-meta">{conflict.conflictingDateStr} · {conflict.conflictingTimeStr}</div>
                                        </div>
                                    </div>
                                </article>
                            </template>
                        </div>
                    </div>
                    <div class="conflicts-modal-footer">
                        <button type="button" class="btn-cancel btn-conflicts-close" onclick={handleCloseStudentConflictsModal}>Close</button>
                    </div>
                </div>
            </div>
        </template>
        <template if:true={showPublishModal}>
            <div class="modal-overlay" onclick={handleClosePublishModal}>
                <div class="month-more-modal-content publish-range-modal" onclick={handleModalClick}>
                    <div class="month-more-modal-header">
                        <h3>Publish sessions</h3>
                        <button type="button" class="close-btn" onclick={handleClosePublishModal} disabled={isPublishingSessions}>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="publish-modal-body">
                        <lightning-input
                            type="date"
                            label="From Date"
                            value={publishFromDate}
                            onchange={handlePublishFromDateChange}
                            required
                            disabled={isPublishingSessions}
                        ></lightning-input>
                        <lightning-input
                            type="date"
                            label="To Date"
                            value={publishToDate}
                            onchange={handlePublishToDateChange}
                            required
                            disabled={isPublishingSessions}
                            class="publish-modal-to-date"
                        ></lightning-input>
                    </div>
                    <div class="publish-modal-footer">
                        <lightning-button
                            variant="neutral"
                            label="Cancel"
                            onclick={handleClosePublishModal}
                            disabled={isPublishingSessions}
                        ></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Publish"
                            onclick={handleConfirmPublishSessions}
                            disabled={isPublishingSessions}
                        ></lightning-button>
                    </div>
                </div>
            </div>
        </template>
        <template if:true={showMonthMoreEventsModal}>
            <div class="modal-overlay" onclick={handleCloseMonthMoreEvents}>
                <div class="month-more-modal-content" onclick={handleModalClick}>
                    <div class="month-more-modal-header">
                        <h3>{monthMoreEventsTitle}</h3>
                        <button class="close-btn" onclick={handleCloseMonthMoreEvents}>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="month-more-modal-list">
                        <template for:each={monthMoreEventsList} for:item="event">
                            <div key={event.rowKey}
                                 class={event.eventClass}
                                 style={event.eventTileStyle}
                                 onclick={handleEventClick}
                                 data-id={event.id}
                                 data-division-id={event.divisionId}
                                 title=""
                                 onmouseenter={handleEventMouseEnter}
                                 onmouseleave={handleEventMouseLeave}>
                                <span class="month-event-time">{event.timeRange}</span>
                                <span class="month-event-title">{event.displayTitle}</span>
                                <span class="month-event-title">{event.divisionDisplayName}</span>
                                <span class="month-event-title">{event.courseName}</span>
                                <span class="month-event-title">{event.primaryFacultyName}</span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>
        <div class="drag-ghost" if:true={isDragging}>
            <span class="drag-ghost-title">{draggedEventTitle}</span>
        </div>
        <!-- Session hover tooltip (Division first, then Course, Course Activity, Faculty, etc.) -->
        <template if:true={showSessionHoverTooltip}>
            <div class="session-hover-tooltip"
                 style={sessionHoverTooltipStyle}
                 role="tooltip">
                <div class="session-tooltip-line"><span class="session-tooltip-label">Division:</span> {hoveredEventTooltip.divisionName}</div>
                <div class="session-tooltip-line"><span class="session-tooltip-label">Course:</span> {hoveredEventTooltip.courseName}</div>
                <div class="session-tooltip-line"><span class="session-tooltip-label">Course Activity:</span> {hoveredEventTooltip.courseActivity}</div>
                <div class="session-tooltip-line"><span class="session-tooltip-label">Faculty:</span> {hoveredEventTooltip.facultyStr}</div>
                <div class="session-tooltip-line"><span class="session-tooltip-label">Support Faculty:</span> {hoveredEventTooltip.supportFacultyStr}</div>
                <div class="session-tooltip-line"><span class="session-tooltip-label">Class Room:</span> {hoveredEventTooltip.classRoom}</div>
            </div>
        </template>
        <!-- Toast Notification -->
        <template if:true={showToast}>
            <div class={toastClass}>
                <span class="toast-message">{toastMessage}</span>
                <button class="toast-close" onclick={handleCloseToast}>×</button>
            </div>
        </template>
    </div>
</template>
