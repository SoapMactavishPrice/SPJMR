<template>
    <lightning-card title="Password Reset" icon-name="utility:success">
        <div class="slds-p-around_medium slds-text-align_center">
            <template if:true={isSuccess}>
                <p class="slds-text-heading_small">Password reset initiated. Please check your inbox for the password reset link.</p>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                    <strong>Login URL:&nbsp;</strong>
                    <a href={siteUrl} target="_blank">{siteUrl}</a>
                </p>
            </template>
            <template if:true={isError}>
                <p class="slds-text-heading_small slds-text-color_error">Something went wrong while resetting your password. Please contact the Admission team for assistance.</p>
            </template>
        </div>
    </lightning-card>
</template>
