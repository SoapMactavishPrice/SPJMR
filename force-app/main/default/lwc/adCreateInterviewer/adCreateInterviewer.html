<template>
    <lightning-card title="Interviewer Management">
        <div class="slds-grid slds-gutters slds-p-around_large">

            <!-- LEFT: Create Form -->
            <div class="slds-col slds-size_4-of-12">
                
                <h3 class="slds-text-heading_small slds-m-bottom_medium">
                    Create Interviewer
                </h3>

                <lightning-input
                    type="text"
                    label="First Name"
                    name="firstName"
                    value={firstName}
                    onchange={handleChange}>
                </lightning-input>

                <lightning-input
                    type="text"
                    label="Last Name"
                    name="lastName"
                    value={lastName}
                    onchange={handleChange}>
                </lightning-input>

                <lightning-input
                    type="email"
                    label="Email"
                    name="email"
                    value={email}
                    onchange={handleChange}>
                </lightning-input>

                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Create User"
                        variant="brand"
                        onclick={handleSubmit}>
                    </lightning-button>
                </div>

            </div>

            <!-- RIGHT: Interviewer Table -->
            <div class="slds-col slds-size_1-of-2">

                <h3 class="slds-text-heading_small slds-m-bottom_medium">
                    Existing Interviewers
                </h3>

                <lightning-datatable
                    key-field="Id"
                    data={userList}
                    columns={columns}
                    onrowselection={getSelectedName}>
                </lightning-datatable>

            </div>

        </div>
    </lightning-card>
</template>
