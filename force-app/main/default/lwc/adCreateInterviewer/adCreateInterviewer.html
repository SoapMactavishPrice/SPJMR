<template>
    <lightning-card title="Interviewer Management">
        <div class="slds-p-horizontal_large slds-p-top_large">
            <lightning-record-picker
                label="Program"
                object-api-name="Program"
                placeholder="Search programs..."
                value={selectedProgramId}
                onchange={handleProgramChange}
                required>
            </lightning-record-picker>
        </div>

        <template if:true={selectedProgramId}>
        <div class="slds-grid slds-gutters slds-p-around_large">

            <!-- LEFT: Create Form -->
            <div class="slds-col slds-size_4-of-12">
                
                <h3 class="slds-text-heading_small slds-m-bottom_medium">
                    Create Interviewer
                </h3>

                <lightning-input
                    type="text"
                    label="First Name"
                    name="firstName"
                    value={firstName}
                    onchange={handleChange}>
                </lightning-input>

                <lightning-input
                    type="text"
                    label="Last Name"
                    name="lastName"
                    value={lastName}
                    onchange={handleChange}>
                </lightning-input>

                <lightning-input
                    type="email"
                    label="Email"
                    name="email"
                    value={email}
                    onchange={handleChange}>
                </lightning-input>

                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Create User"
                        variant="brand"
                        onclick={handleSubmit}>
                    </lightning-button>
                </div>

            </div>

            <!-- RIGHT: Interviewer Table -->
            <div class="slds-col slds-size_8-of-12">

                <h3 class="slds-text-heading_small slds-m-bottom_medium">
                    Existing Interviewers
                </h3>

                <div class="interviewer-table">
                    <lightning-datatable
                        key-field="Id"
                        data={userList}
                        columns={columns}
                        column-widths-mode="fixed"
                        onrowselection={getSelectedName}>
                    </lightning-datatable>
                </div>

            </div>

        </div>
        </template>
    </lightning-card>
</template>
