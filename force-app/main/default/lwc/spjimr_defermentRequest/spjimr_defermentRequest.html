<template>

    <template if:true={isLoadingRequest}>
        <p>Loading...</p>
    </template>

    <template if:false={isLoadingRequest}>
    <template if:false={hasActiveRequest}>
        <p class="no-active-request">
            Deferment Request is not currently available. It will be enabled once
            your Programme Manager opens a deferment window for you.
        </p>
    </template>

    <template if:true={showWindowMessage}>
    <div class="window-message">

        <template if:true={isWindowOpen}>
            <span>
                Deferment Request is currently open.
                You can submit your request until
                <span class="window-end-date">
                <lightning-formatted-date-time
                    value={breakEndDateTime}
                    month="2-digit"
                    day="2-digit"
                    year="numeric">
                </lightning-formatted-date-time>.
                </span>.
            </span>
        </template>

        <template if:true={isWindowExpired}>
            <span>
                Your Deferment Request window has expired.
                Please contact the Programme Manager to enable the window again.
            </span>
        </template>

        <template if:true={isWindowNotStarted}>
            <span>
                Your Deferment Request window is not open yet.
                Please wait until the window opens.
            </span>
        </template>

        <template if:true={isWindowReopened}>
            <span>
                Your previous Deferment Request was rejected.
                Review the remarks below, update what's needed, and resubmit.
            </span>
        </template>

        <template if:true={isWindowApproved}>
            <span>
                Your Deferment Request has been approved by the approvers.
                The Programme Manager needs to update the Rejoining Details.
            </span>
        </template>
    </div>
</template>

     <template if:true={showDefermentForm}>
    <div class="deferment-form">

        <!-- Success Message -->
        <template if:true={submitSuccess}>
            <div class="success-banner">
                <span class="success-check">✓</span>
                Deferment Request submitted successfully!
            </div>
        </template>

        <!-- Header -->
        <div class="deferment-header">
            Deferment Request
        </div>

        <!-- Reason for Deferment -->
        <div class="field-block">
            <label class="field-label">
                Reason for Deferment
                <span class="required-mark">*</span>
            </label>

            <textarea
                class={reasonFieldClass}
                placeholder="Enter your reason..."
                value={reason}
                onchange={handleReasonChange}>
            </textarea>

            <template if:true={reasonHasError}>
                <p class="field-error">
                    This field is required.
                </p>
            </template>
        </div>

        <!-- Documents to Support Request -->
        <div class="field-block">
            <label class="field-label">
                Documents to support Request
                <span class="required-mark">*</span>
            </label>

            <template if:true={existingDocumentsFile}>
                <template if:false={documentsFile}>
                    <p class="existing-file">
                        Currently uploaded: <strong>{existingDocumentsFile.fileName}</strong>
                        — choose a new file below to replace it.
                    </p>
                </template>
            </template>

            <div class={documentsBoxClass}>

                <p class="upload-title">
                    Upload Document
                </p>

                <label class="upload-browse">
                    Browse Files

                    <input
                        type="file"
                        data-field="documents"
                        accept=".pdf,.jpg,.jpeg"
                        onchange={handleFileChange}
                        class="upload-input"
                    />
                </label>

                <p class="upload-hint">
                    Must be .pdf, .jpg file and not exceeding
                    <strong>15mb</strong> file size
                </p>

                <template if:true={documentsFile}>
                    <p class="upload-filename">
                        {documentsFile.name}
                    </p>
                </template>

            </div>

            <template if:true={documentsHasError}>
                <p class="field-error">
                    This field is required.
                </p>
            </template>
        </div>

        <!-- Approval Email -->
        <div class="field-block">
            <label class="field-label">
                Approval Email (screenshot) with rejoining Condition
                <span class="required-mark">*</span>
            </label>

            <template if:true={existingApprovalEmailFile}>
                <template if:false={approvalEmailFile}>
                    <p class="existing-file">
                        Currently uploaded: <strong>{existingApprovalEmailFile.fileName}</strong>
                        — choose a new file below to replace it.
                    </p>
                </template>
            </template>

            <div class={approvalEmailBoxClass}>

                <p class="upload-title">
                    Upload Document
                </p>

                <label class="upload-browse">
                    Browse Files

                    <input
                        type="file"
                        data-field="approvalEmail"
                        accept=".pdf,.jpg,.jpeg"
                        onchange={handleFileChange}
                        class="upload-input"
                    />
                </label>

                <p class="upload-hint">
                    Must be .pdf, .jpg file
                </p>

                <template if:true={approvalEmailFile}>
                    <p class="upload-filename">
                        {approvalEmailFile.name}
                    </p>
                </template>

            </div>

            <template if:true={approvalEmailHasError}>
                <p class="field-error">
                    This field is required.
                </p>
            </template>
        </div>

        <!-- Rejoining Condition Acceptance -->
        <div class="field-block">
            <label class="field-label">
                Rejoining Condition Acceptance Email Screenshot
                <span class="required-mark">*</span>
            </label>

            <template if:true={existingRejoiningAcceptanceFile}>
                <template if:false={rejoiningAcceptanceFile}>
                    <p class="existing-file">
                        Currently uploaded: <strong>{existingRejoiningAcceptanceFile.fileName}</strong>
                        — choose a new file below to replace it.
                    </p>
                </template>
            </template>

            <div class={rejoiningAcceptanceBoxClass}>

                <p class="upload-title">
                    Upload Document
                </p>

                <label class="upload-browse">
                    Browse Files

                    <input
                        type="file"
                        data-field="rejoiningAcceptance"
                        accept=".pdf,.jpg,.jpeg"
                        onchange={handleFileChange}
                        class="upload-input"
                    />
                </label>

                <p class="upload-hint">
                    Must be .pdf, .jpg file
                </p>

                <template if:true={rejoiningAcceptanceFile}>
                    <p class="upload-filename">
                        {rejoiningAcceptanceFile.name}
                    </p>
                </template>

            </div>

            <template if:true={rejoiningAcceptanceHasError}>
                <p class="field-error">
                    This field is required.
                </p>
            </template>
        </div>

        <!-- Fees + Transaction Details -->
        <div class="field-row">

            <!-- Fees -->
            <div class="field-block field-block_half">

                <label class="field-label">
                    Deferment Application fees
                    <span class="required-mark">*</span>
                </label>

                <input
                    type="text"
                    class="fee-input"
                    value={feesDisplay}
                    readonly
                />

            </div>

            <!-- Transaction Details -->
<div class="field-block field-block_half">

    <label class="field-label">
        Transaction Details (Screenshot)
        <span class="required-mark">*</span>
    </label>

    <template if:true={isFeeApplicable}>

        <template if:true={existingTransactionFile}>
            <template if:false={transactionFile}>
                <p class="existing-file">
                    Currently uploaded: <strong>{existingTransactionFile.fileName}</strong>
                    — choose a new file below to replace it.
                </p>
            </template>
        </template>

        <div class={transactionBoxClass}>

            <p class="upload-title">
                Upload Document
            </p>

            <label class="upload-browse">
                Browse Files

                <input
                    type="file"
                    data-field="transaction"
                    accept=".pdf,.jpg,.jpeg"
                    onchange={handleFileChange}
                    class="upload-input"
                />
            </label>

            <p class="upload-hint">
                Must be .pdf, .jpg file
            </p>

            <template if:true={transactionFile}>
                <p class="upload-filename">
                    {transactionFile.name}
                </p>
            </template>

        </div>

    </template>

    <template if:false={isFeeApplicable}>

        <input
            type="text"
            class="fee-input"
            value="Not Applicable"
            readonly
        />

    </template>

    <template if:true={transactionHasError}>
        <p class="field-error">
            This field is required.
        </p>
    </template>

</div>
        </div>

        <!-- Submit -->
        <button
            type="button"
            class="submit-btn"
            onclick={handleSubmit}
            disabled={isSubmitting}>
            Submit
        </button>

    </div>
</template>
   <template if:true={showTracker}>
        <div class="tracker-card">
            <div class="tracker-header">Deferment Status Tracker</div>

            <div class="status-pill">{trackerStatusLabel}</div>

            <div class="tracker-row">
                <template for:each={trackerSteps} for:item="step">
                    <div class="tracker-step" key={step.key}>
                        <div class={step.circleClass}>{step.number}</div>
                        <div class={step.labelClass}>{step.label}</div>
                    </div>
                </template>
            </div>

            <div class="tracker-table-wrap">
                <table class="tracker-table">
                    <thead>
                        <tr>
                            <th>Request No.</th>
                            <th>Submitted Date</th>
                            <th>Reason</th>
                            <th>Application Fee</th>
                            <th>Status</th>
                            <th>Approved / Rejected</th>
                            <th>L1 Remark</th>
                            <th>L2 Remark</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>{trackerRequestNumberDisplay}</td>
                            <td>{trackerSubmittedDateDisplay}</td>
                            <td>{trackerReasonDisplay}</td>
                            <td>{trackerApplicationFeeDisplay}</td>
                            <td><span class="status-badge">{trackerStatusLabel}</span></td>
                            <td>{trackerApprovalStatusDisplay}</td>
                            <td>{trackerL1RemarkDisplay}</td>
<td>{trackerL2RemarkDisplay}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div> 
    </template>    
</template>
