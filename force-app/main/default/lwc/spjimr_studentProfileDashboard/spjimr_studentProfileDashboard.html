<template>
    <!-- 491 start-->
    <!-- Custom Notification Banner -->
    <template if:true={showBanner}>
        <div class={bannerClass}>
            <span>{bannerMessage}</span>
            <lightning-button-icon
                class="banner-close-btn"
                icon-name="utility:close"
                alternative-text="Close"
                onclick={closeBanner}
                variant="bare-inverse">
            </lightning-button-icon>
        </div>
    </template>
    <!-- 491 end-->
    <div class="dashboard-container">
        <!-- Dashboard Body -->
        <div class="dashboard-body">
            <!-- Main Content Area -->
            <main class={mainContentClass}>
                <div class="main-contianer">
                    <div class="header-container">
                        <div>
                            <h2 class="dxp-text-heading-large">Student Profile Dashboard</h2>
                            <c-spjimr_student-info-header class="slds-m-top--small"></c-spjimr_student-info-header>
                        </div>
                    </div>
                </div>
                <template if:true={isStudentDetailsSection}>
                    <!-- Toast-style notice: ShowToastEvent often does not render on Experience Cloud / nested LWCs -->
                    <template if:true={photoUploadSuccessVisible}>
                        <div class="photo-upload-success-banner" role="alert">
                            <lightning-icon
                                icon-name="utility:success"
                                alternative-text="Success"
                                size="small"
                                class="photo-upload-success-banner__icon"
                            ></lightning-icon>
                            <span class="photo-upload-success-banner__text">{photoUploadSuccessMessage}</span>
                            <lightning-button-icon
                                icon-name="utility:close"
                                alternative-text="Dismiss"
                                variant="bare-inverse"
                                class="photo-upload-success-banner__close"
                                onclick={dismissPhotoUploadSuccess}
                            ></lightning-button-icon>
                        </div>
                    </template>
                    <div class="student-details-header-bar">
                        <h2 class="student-details-header-text dxp-text-heading-xxsmall">Student Details</h2>
                    </div>
                    <div class="slds-m-top--large studentDetailsCard">
                        <article class="slds-card article-card">
                            <!-- Student Details Header -->
                            <div class="slds-card__body slds-card__body_inner slds-m-top--x-large">
                                <div class="slds-grid slds-gutters">
                                    <!-- Left: Profile Placeholder + Upload Photo -->
                                    <div class="slds-col slds-size_1-of-12">
                                        <div class="profile-placeholder">
                                            <span class="slds-avatar slds-avatar_circle profile-avatar">
                                                <img
                                                    alt="Profile"
                                                    src={displayProfileImageUrl}
                                                    title="User avatar"
                                                    class="student-details-profile-img"
                                                    onerror={handleProfilePhotoError}
                                                />
                                            </span>
                                            <input
                                                type="file"
                                                class="profile-photo-input slds-hide"
                                                accept=".jpg,.jpeg,.png,image/jpeg,image/jpg,image/png"
                                                onchange={handleProfilePhotoFileChange}
                                            />
                                        </div>
                                        <template if:true={showUploadPhotoButton}>
                                            <div>
                                                <button
                                                    type="button"
                                                    class="upload-photo-link slds-m-top_x-small"
                                                    onclick={handleUploadPhotoClick}
                                                >
                                                    Upload Photo
                                                </button>
                                            </div>
                                        </template>
                                    </div>
                                    <!-- Middle: User Details -->
                                    <div class="slds-col slds-m-left--large slds-size_7-of-12">
                                        <div class="slds-grid slds-gutters slds-size--2-of-4">
                                            <div class="slds-col">
                                                <h2 class="slds-text-heading_medium student-name-header">{displayStudentName}
                                                </h2>
                                                <p class="slds-text-body_small slds-m-top--xx-small student-id-text">
                                                    {displayRollNumber}
                                                </p>
                                                <p
                                                    class="slds-text-body_small slds-m-top--xx-small student-program-text">
                                                    {displayProgramName}</p>
                                            </div>
                                            <!-- <div class="slds-col">
                                                <lightning-badge label="Status: Accepted" class="status-badge-accepted">
                                                </lightning-badge>
                                            </div> -->
                                        </div>
                                    </div>
                                    <!-- Right: Action Button -->
                                    <div class="slds-col slds-size_3-of-12 slds-text-align_right slds-m-left--xx-large">
                                        <lightning-button label="Change of Specialization" variant="brand" disabled={isSpecializationButtonDisabled}
                                            class="specialization-button" onclick={handleChangeSpecialization}>
                                        </lightning-button>
                                    </div>
                                </div>
                            </div>
                            <!-- Three Column Sections -->
                            <div class="slds-card__body slds-card__body_inner slds-m-top--x-large">
                                <div class="slds-grid slds-gutters">
                                    <!-- Left Column: Personal Details -->
                                    <div class="slds-col slds-size_1-of-3">
                                        <h3 class="slds-section-title dxp-text-heading-xsmall section-title">Personal
                                            Details</h3>
                                            <div  style="margin-left:5px">
                                        <dl class="slds-dl_horizontal slds-m-top_small">
                                            <dt class="slds-dl_horizontal__label">
                                                <p class="slds-truncate dxp-text-body">Date of Birth</p>
                                            </dt>
                                            <dd class="slds-dl_horizontal__detail">
                                                <p class="slds-truncate dxp-text-body">{displayDateOfBirth}</p>
                                            </dd>
                                            <dt class="slds-dl_horizontal__label">
                                                <p class="slds-truncate dxp-text-body ">Gender</p>
                                            </dt>
                                            <dd class="slds-dl_horizontal__detail">
                                                <p class="slds-truncate  dxp-text-body">{displayStudentGender}</p>
                                            </dd>
                                        </dl>
                                            </div>
                                        <h3 class="slds-section-title dxp-text-heading-xsmall section-title slds-m-top_medium">
                                            Contact info</h3>
                                            <div  style="margin-left:5px">
                                        <dl class="slds-dl_horizontal slds-m-top_small">
                                            <dt class="slds-dl_horizontal__label">
                                                <p class="slds-truncate dxp-text-body">Phone</p>
                                            </dt>
                                            <dd class="slds-dl_horizontal__detail">
                                                <p class="slds-truncate dxp-text-body">{displayMobileNumber}</p>
                                            </dd>
                                            <dt class="slds-dl_horizontal__label">
                                                <p class="slds-truncate dxp-text-body ">Email</p>
                                            </dt>
                                            <dd class="slds-dl_horizontal__detail">
                                                <p class="dxp-text-body">{displayStudentEmail}</p>
                                            </dd>
                                            <dt class="slds-dl_horizontal__label address-label">
                                                <p class="dxp-text-body">Address</p>
                                            </dt>
                                            <!-- <dd class="slds-dl_horizontal__detail address-value">
                                                <p class="dxp-text-body">Plot no 20, johny street, Bengaluru, Karnataka
                                                    - 600811</p>
                                            </dd> -->
                                            <dd class="slds-dl_horizontal__detail address-value">
                                                <p class="dxp-text-body">{displayAddress}</p>
                                            </dd>
                                        </dl>
                                       <div class="slds-m-top_medium">
                                            <lightning-button label="Emergency contact" variant="brand"
                                                class="emergency-button" onclick={handleEmergencyContact}>
                                            </lightning-button>
                                        </div>
                                            </div>
                                    </div>
                                    <!-- Middle Column: Academic Background -->
                                    <div class="slds-col slds-size_1-of-3">
                                        <h3 class="slds-section-title dxp-text-heading-xsmall section-title">Academic
                                            Background
                                        </h3>
                                        <div style="margin-left:5px">
                                        <dl class="slds-dl_horizontal slds-m-top_small">
                                            <dt class="slds-dl_horizontal__label" style="width:45%">
                                                <p class="dxp-text-body">Previous Qualification</p>
                                            </dt>
                                            <dd class="slds-dl_horizontal__detail" style="width:50%">
                                                <p class="dxp-text-body">{displayPrevQualification}</p>
                                            </dd>
                                            <dt class="slds-dl_horizontal__label">
                                                <p class="slds-truncate dxp-text-body ">Graduation Year</p>
                                            </dt>
                                            <dd class="slds-dl_horizontal__detail">
                                                <p class="slds-truncate  dxp-text-body">{displayGraduationYear}</p>
                                            </dd>
                                            <dt class="slds-dl_horizontal__label">
                                                <p class="slds-truncate dxp-text-body">Marks/CGPA</p>
                                            </dt>
                                            <dd class="slds-dl_horizontal__detail">
                                                <p class="slds-truncate dxp-text-body">{displayMarks}</p>
                                            </dd>
                                        </dl>
                                        </div>
                                        <!-- <div>
                                            <p class="dxp-text-body certificate-label">
                                                <span class="certificate-bold">Certificates</span> (Download link from
                                                document
                                                repository)
                                            </p>
                                            <button type="button" onclick={handleDownloadCertificate} class="link-button">
                                        Download certificate</button>
                                        </div> -->
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <h3 class="slds-section-title dxp-text-heading-xsmall section-title">Work Experience
                                        </h3>
                                        <div style="margin-left:5px">
                                        <dl class="slds-dl_horizontal slds-m-top_small">
                                            <dt class="slds-dl_horizontal__label" style="width:45%">
                                                <p class="dxp-text-body">Last Organization Name</p>
                                            </dt>
                                            <dd class="slds-dl_horizontal__detail org-name-value" style="width:50%">
                                                <p class="dxp-text-body org-name-text">{displayOrgName}</p>
                                            </dd>
                                            <dt class="slds-dl_horizontal__label">
                                                <p class="slds-truncate dxp-text-body ">Duration</p>
                                            </dt>
                                            <dd class="slds-dl_horizontal__detail">
                                                <p class="slds-truncate  dxp-text-body">{displayWorkDuration}</p>
                                            </dd>
                                            <dt class="slds-dl_horizontal__label">
                                                <p class="slds-truncate dxp-text-body">Work Experience</p>
                                            </dt>
                                            <dd class="slds-dl_horizontal__detail">
                                                <p class="slds-truncate dxp-text-body">{displayTotalWorkExperience}</p>
                                            </dd>
                                        </dl>
                                        </div>
                                        <!-- <div>
                                            <p class="dxp-text-body certificate-label">
                                                <span class="certificate-bold">Certificates</span> (Download link from
                                                document
                                                repository)
                                            </p>
                                            <button type="button" onclick={handleDownloadCertificate} class="link-button">
                                        Download certificate</button>
                                        </div> -->
                                    </div>
                                    <!-- Right Column: Fees Section -->
                                    <!-- <div class="slds-col slds-size_1-of-3">
                                        <h3 class="slds-section-title dxp-text-heading-xsmall section-title">Fees
                                            Section</h3>
                                        <dl class="slds-dl_horizontal slds-m-top_small">
                                            <dt class="slds-dl_horizontal__label">
                                                <p class="slds-truncate dxp-text-body">Application Fee</p>
                                            </dt>
                                            <dd class="slds-dl_horizontal__detail">
                                                <p class="slds-truncate dxp-text-body">₹1,000</p>
                                            </dd>
                                            <dt class="slds-dl_horizontal__label">
                                                <p class="slds-truncate dxp-text-body ">Payment Status</p>
                                            </dt>
                                            <dd class="slds-dl_horizontal__detail">
                                                <p class="slds-truncate  dxp-text-body">Pending</p>
                                            </dd>
                                            <dt class="slds-dl_horizontal__label">
                                                <p class="slds-truncate dxp-text-body">Due Date</p>
                                            </dt>
                                            <dd class="slds-dl_horizontal__detail">
                                                <p class="slds-truncate dxp-text-body">12/03/2025</p>
                                            </dd>
                                        </dl>
                                        <div class="slds-m-top_medium">
                                            <div class="slds-grid slds-grid_vertical slds-gutters">
                                                <div class="slds-col slds-m-bottom--small">
                                                    <lightning-button label="Upload Missing Documents" variant="brand"
                                                        class="upload-button full-width-button"
                                                        onclick={handleUploadDocuments}>
                                                    </lightning-button>
                                                </div>
                                                <div class="slds-col">
                                                    <lightning-button label="Pay Academic Fee" variant="brand"
                                                        class="pay-button full-width-button"
                                                        onclick={handlePayAcademicFee}>
                                                    </lightning-button>
                                                </div>
                                            </div>
                                        </div>
                                    </div> -->
                                </div>
                            </div>
                        </article>
                    </div>
                </template>
            </main>
        </div>
         <!-- Emergency Contact Modal -->
        <template if:true={isEmergencyModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open emergency-modal">
                <div class="slds-modal__container emergency-modal__container">
                    <header class="slds-modal__header emergency-modal__header">
                        <h2 class="slds-text-heading_medium emergency-modal__title">Emergency Contact Details</h2>
                        <button class="emergency-modal__close" onclick={closeEmergencyModal} aria-label="Close">
                            &times;
                        </button>
                    </header>
                    <div class="slds-modal__content emergency-modal__content" id="emergency-modal-content">
                        <!-- Parent Contact Details -->
                        <div class="emergency-section">
                            <div class="emergency-section__header">
                                <h3 class="dxp-text-heading-xsmall emergency-section__title">Parent Contact Details</h3>
                                <template if:true={hasParentRecord}>
                                    <button class="slds-button slds-button_brand emergency-section__edit" onclick={handleEditParent}>
                                        Edit Emergency contact
                                    </button>
                                </template>
                                <template if:false={hasParentRecord}>
                                    <button class="slds-button slds-button_brand emergency-section__edit" onclick={handleCreateParent}>
                                        Create Emergency contact
                                    </button>
                                </template>
                            </div>
                            <template if:true={hasParentRecord}>
                                <div class="emergency-card">
                                    <div class="emergency-row">
                                        <div class="emergency-label">Primary Contact Name*</div>
                                        <div class="emergency-value">{parentDisplayName}</div>
                                    </div>
                                    <div class="emergency-row">
                                        <div class="emergency-label">Relationship*</div>
                                        <div class="emergency-value">{parentDisplayRelationship}</div>
                                    </div>
                                    <div class="emergency-row">
                                        <div class="emergency-label">Mobile Number*</div>
                                        <div class="emergency-value">{parentDisplayPhone}</div>
                                    </div>
                                    <div class="emergency-row">
                                        <div class="emergency-label">Alternate Number</div>
                                        <div class="emergency-value">{parentDisplayAlternate}</div>
                                    </div>
                                    <div class="emergency-row emergency-row--address">
                                        <div class="emergency-label">Address :</div>
                                        <div class="emergency-value">
                                            {parentDisplayAddress}
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <template if:false={hasParentRecord}>
                                <div class="emergency-card">
                                    <div class="slds-text-align_center slds-p-around_medium">
                                        <p class="dxp-text-body">No parent contact details found. Click "Create Emergency contact" to add.</p>
                                    </div>
                                </div>
                            </template>
                        </div>
                        <!-- Local Guardian Contact Details -->
                        <div class="emergency-section">
                            <div class="emergency-section__header">
                                <h3 class="dxp-text-heading-xsmall emergency-section__title">Local Guardian Contact Details</h3>
                                <template if:true={hasGuardianRecord}>
                                    <button class="slds-button slds-button_brand emergency-section__edit" onclick={handleEditGuardian}>
                                        Edit Emergency contact
                                    </button>
                                </template>
                                <template if:false={hasGuardianRecord}>
                                    <button class="slds-button slds-button_brand emergency-section__edit" onclick={handleCreateGuardian}>
                                        Create Emergency contact
                                    </button>
                                </template>
                            </div>
                            <template if:true={hasGuardianRecord}>
                                <div class="emergency-card">
                                    <div class="emergency-row">
                                        <div class="emergency-label">Primary Contact Name*</div>
                                        <div class="emergency-value">{guardianDisplayName}</div>
                                    </div>
                                    <div class="emergency-row">
                                        <div class="emergency-label">Relationship*</div>
                                        <div class="emergency-value">{guardianDisplayRelationship}</div>
                                    </div>
                                    <div class="emergency-row">
                                        <div class="emergency-label">Mobile Number*</div>
                                        <div class="emergency-value">{guardianDisplayPhone}</div>
                                    </div>
                                    <div class="emergency-row">
                                        <div class="emergency-label">Alternate Number</div>
                                        <div class="emergency-value">{guardianDisplayAlternate}</div>
                                    </div>
                                    <div class="emergency-row emergency-row--address">
                                        <div class="emergency-label">Address :</div>
                                        <div class="emergency-value">
                                            {guardianDisplayAddress}
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <template if:false={hasGuardianRecord}>
                                <div class="emergency-card">
                                    <div class="slds-text-align_center slds-p-around_medium">
                                        <p class="dxp-text-body">No guardian contact details found. Click "Create Emergency contact" to add.</p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <!-- Edit Emergency Contact Modal -->
        <template if:true={isEditModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open emergency-modal">
                <div class="slds-modal__container emergency-modal__container">
                    <header class="slds-modal__header emergency-modal__header">
                        <h2 class="slds-text-heading_medium emergency-modal__title">{editModalTitle}</h2>
                        <button class="emergency-modal__close" onclick={closeEditModal} aria-label="Close">
                            &times;
                        </button>
                    </header>
                    <div class="slds-modal__content emergency-modal__content">
                        <div class="emergency-section">
                            <h3 class="dxp-text-heading-xsmall emergency-section__title slds-m-bottom_medium">Emergency Contact Details</h3>
                            
                            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input 
                                        type="text" 
                                        class="emergency-edit-name"
                                        label="Primary Contact Name"
                                        value={editFormData.name}
                                        data-field="name"
                                        onchange={handleInputChange}
                                        placeholder="Enter Primary Contact Name"
                                        max-length="80"
                                        required>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-combobox
                                        class="emergency-edit-relationship"
                                        label="Relationship"
                                        value={editFormData.relationship}
                                        data-field="relationship"
                                        onchange={handleInputChange}
                                        options={currentRelationshipOptions}
                                        placeholder="Select Relationship"
                                        disabled={isRelationshipReadOnly}
                                        required>
                                    </lightning-combobox>
                                </div>
                            </div>
                            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input 
                                        type="tel" 
                                        class="emergency-edit-phone"
                                        label="Mobile Number"
                                        value={editFormData.phone}
                                        data-field="phone"
                                        onchange={handleInputChange}
                                        placeholder="10 digits only"
                                        max-length="10"
                                        required>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input 
                                        type="tel" 
                                        class="emergency-edit-alternate"
                                        label="Alternate Number"
                                        value={editFormData.alternateNumber}
                                        data-field="alternateNumber"
                                        onchange={handleInputChange}
                                        placeholder="10 digits only"
                                        max-length="10">
                                    </lightning-input>
                                </div>
                            </div>
                            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                                <div class="slds-col">
                                    <lightning-textarea
                                        class="emergency-edit-address"
                                        label="Address"
                                        value={editFormData.address}
                                        data-field="address"
                                        onchange={handleInputChange}
                                        placeholder="Enter Your Address"
                                        max-length="250"
                                        required>
                                    </lightning-textarea>
                                </div>
                            </div>
                            <div class="slds-text-align_center slds-m-top_large">
                                <lightning-button 
                                    label="Save & Submit" 
                                    variant="brand"
                                    onclick={handleSaveEmergencyContact}
                                    disabled={isLoading}
                                    class="emergency-section__edit">
                                </lightning-button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <!-- Profile photo: batch instructions before file picker -->
        <template if:true={isPhotoUploadInstructionModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="photo-upload-instruction-title"
                class="slds-modal slds-fade-in-open emergency-modal">
                <div class="slds-modal__container emergency-modal__container photo-instruction-modal__container">
                    <header class="slds-modal__header emergency-modal__header">
                        <h2 id="photo-upload-instruction-title" class="slds-text-heading_medium emergency-modal__title">
                            Photo Upload
                        </h2>
                        <button type="button" class="emergency-modal__close" onclick={handlePhotoUploadInstructionCancel}
                            aria-label="Close">
                            &times;
                        </button>
                    </header>
                    <div class="slds-modal__content emergency-modal__content">
                        <p class="photo-instruction-modal__intro slds-m-bottom_small">
                            Please review the following before you upload your photo.
                        </p>
                        <div class="photo-instruction-modal__body">
                            <lightning-formatted-rich-text
                                value={photoUploadInstructionRichHtml}
                            ></lightning-formatted-rich-text>
                        </div>
                        <div class="slds-grid slds-grid_align-end slds-m-top_large slds-gutters_x-small">
                            <div class="slds-col">
                                <lightning-button variant="brand" label="Cancel"
                                    class="photo-instruction-modal__cancel"
                                    onclick={handlePhotoUploadInstructionCancel}>
                                </lightning-button>
                            </div>
                            <div class="slds-col">
                                <lightning-button variant="brand" label="OK / Proceed"
                                    onclick={handlePhotoUploadInstructionProceed}>
                                </lightning-button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <!--491 start -->
        <template if:true={isSpecializationModalOpen}>
            <section
                role="dialog"
                tabindex="-1"
                class="slds-modal slds-fade-in-open custom-modal">
                <div class="slds-modal__container">
                    <!-- Header -->
                    <div class="modal-header">
                        <h2 class="modal-title">
                            Change Specialization
                        </h2>

                        <lightning-button-icon
                            icon-name="utility:close"
                            variant="bare"
                            alternative-text="Close"
                            onclick={closeSpecializationModal}
                            class="close-btn">
                        </lightning-button-icon>
                    </div>
                    <!-- Body -->
                    <div class="modal-body">
                        <!-- Latest Request Card -->
                        <template if:true={latestRequest}>
                            <div class="request-status-card">
                                <div class="status-header">
                                    Latest Request
                                </div>
                                <div class="status-row">
                                    <span class="label">
                                        Requested Specialization:
                                    </span>
                                    <span>
                                        {latestRequest.requestedSpecialization}
                                    </span>
                                </div>
                                <div class="status-row">
                                    <span class="label">
                                        Status:
                                    </span>
                                    <span class={statusClass}>
                                        {latestRequest.status}
                                    </span>
                                </div>
                                <div class="status-row">
                                    <span class="label">
                                        Requested On:
                                    </span>
                                    <span>
                                        {latestRequest.createdDate}
                                    </span>
                                </div>
                            </div>
                        </template>
                        <!-- History Table -->
                        <template if:true={requestHistory.length}>
                            <div class="slds-m-top_medium">
                                <h3 class="section-heading">
                                    Request History
                                </h3>
                                <div class="history-table-wrapper">
                                    <lightning-datatable
                                        key-field="id"
                                        data={requestHistory}
                                        columns={requestColumns}
                                        hide-checkbox-column>
                                    </lightning-datatable>
                                </div>
                            </div>
                        </template>
                        <!-- Pending Request Banner -->
                        <template if:true={hasPendingRequest}>
                            <div class="pending-banner">
                                A specialization change request is
                                already under review.

                                You cannot submit another request
                                until the current request is processed.

                            </div>
                        </template>
                        <!-- New Request Form -->
                        <template if:false={hasPendingRequest}>
                            <div class="slds-m-top_large">
                                <h3 class="section-heading">
                                    Create New Request
                                </h3>
                                <!-- Your existing specialization table -->
                                <div class="specialization-table-wrapper">
                                    <table class="slds-table slds-table_bordered">
                                        <thead>
                                            <tr>
                                                <th>Specialization</th>
                                                <th>Select</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={specializationOptions} for:item="option">
                                                <tr key={option.specializationId}>
                                                    <td>
                                                        {option.specializationName}
                                                    </td>
                                                    <td>
                                                        <lightning-input
                                                            type="radio"
                                                            name="specialization"
                                                            data-id={option.specializationId}
                                                            checked={option.selected}
                                                            onchange={handleSpecializationSelection}>
                                                        </lightning-input>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                                <lightning-textarea
                                    label="Reason"
                                    value={specializationChangeReason}
                                    onchange={handleReasonChange}
                                    class="slds-m-top_medium">
                                </lightning-textarea>
                            </div>
                        </template>
                    </div>
                    <!-- Footer -->
                    <div class="modal-footer">
                        <lightning-button
                            label="Cancel"
                            onclick={closeSpecializationModal}>
                        </lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Submit"
                            onclick={handleSubmitSpecialization}>
                        </lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <!--491 end -->
    </div>
</template>
