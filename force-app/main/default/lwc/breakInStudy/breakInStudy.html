<template>
    <lightning-quick-action-panel header="Break in Study">

        <div class="slds-p-around_medium">

            <lightning-input
                type="datetime"
                label="Start Date"
                value={startDate}
                onchange={handleStartDateChange}
                required>
            </lightning-input>

            <lightning-input
                class="slds-m-top_medium"
                type="datetime"
                label="End Date"
                value={endDate}
                onchange={handleEndDateChange}
                required>
            </lightning-input>

            <lightning-input
                class="slds-m-top_medium"
                type="number"
                label="Deferment Application Fee"
                value={fee}
                step="0.01"
                min="0"
                onchange={handleFeeChange}
                required>
            </lightning-input>

        </div>

        <div slot="footer">

            <lightning-button
                label="Cancel"
                onclick={handleCancel}>
            </lightning-button>

            <lightning-button
                class="slds-m-left_small"
                variant="brand"
                label="Save"
                onclick={handleSave}
                disabled={isLoading}>
            </lightning-button>

        </div>

    </lightning-quick-action-panel>
</template>
