<template>
   <div class="attendance-wrapper">
        <div class="attendance-header">
            Attendance
        </div>
      <div class="top-filter-row">

    <!-- Course Dropdown -->
    <div class="course-selector">

        <div class="course-picker-box" onclick={toggleCourseDropdown}>

            <template for:each={selectedCourseChips} for:item="course">
                <span key={course.value} class="course-chip">
                    {course.label}
                    <button
                        class="chip-remove"
                        data-value={course.label}
                        onclick={handleRemoveCourse}>
                        ×
                    </button>
                </span>
            </template>

            <span class="add-course-link">
                {courseDropdownLabel}
            </span>

        </div>

        <template if:true={isCourseDropdownOpen}>
            <div class="dropdown-panel" onclick={stopPanelClick}>
                <template if:true={unselectedCourseOptions.length}>
                    <template for:each={unselectedCourseOptions} for:item="course">
                        <div
                            key={course.value}
                            class="dropdown-item"
                            data-value={course.label}
                            onclick={handleAddCourse}>
                            {course.label}
                        </div>
                    </template>
                </template>

                <template if:true={noMoreCourses}>
                    <div class="dropdown-empty">
                        No more courses to add
                    </div>
                </template>
            </div>
        </template>

    </div>

    <!-- Date Filters -->
    <div class="date-range-row">
        <!-- AC1 — Start Date and End Date filters -->
        <div class="date-field">
        <label class="date-label">From Date</label>    
            <lightning-input
                type="date"
                variant="label-hidden"
                value={startDate}
                min={termStartDate}
                max={termEndDate}
                onchange={handleStartDateChange}>
            </lightning-input>
        </div>

        <div class="date-field">
        <label class="date-label">To Date</label>   
            <lightning-input
                type="date"
                variant="label-hidden"
                value={endDate}
                data-id="endDateInput"
                min={termStartDate}
                max={termEndDate}
                onchange={handleEndDateChange}>
            </lightning-input>
        </div>
        <div class="date-range-actions">
            <lightning-button
                label="Search"
                variant="brand"
                onclick={handleSearchClick}>
            </lightning-button>

            <lightning-button
                label="Clear"
                variant="base"
                onclick={handleClearClick}>
            </lightning-button>
        </div>

    </div>

</div>

        <div class="attendance-body slds-grid slds-gutters">
            <div class="slds-col slds-size_4-of-12 donut-col">

                <div class="slds-align_absolute-center">
                    <div class="donut" style={donutStyle}>
                        <div class="donut-text" style={donutTextStyle}>
                            {overallAttendancePercent}%
                        </div>
                    </div>
                </div>
               
                <div class="slds-text-align_center slds-m-top_medium">
                    <div class="overall-text">Overall Attendance</div>

                            <span>{warningMessage}</span>
                        </div>    
                    </template>
                    -->
                </div>
            
            </div>

                <div class="tab-container">
                    <button class={dayClass}   onclick={handleDayClick}>Day</button>
                    <button class={weekClass}  onclick={handleWeekClick}>Week</button>
                    <button class={monthClass} onclick={handleMonthClick}>Month</button>
                    <button class={yearClass}  onclick={handleYearClick}>Year</button>
                </div>
                <!--SE-1174-->
                <template lwc:if={noRecordsMessage}>
                    <p class="slds-text-color_weak slds-m-top_small">{noRecordsMessage}</p>
                </template>
                <!--SE-1174-->

                <div class="table-container slds-m-top_medium">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th class="course-col" scope="col">Course</th>
                                <th class="session-count-col" scope="col">
                                    <span class="th-line">Total</span>
                                    <span class="th-line">Sessions</span>
                                </th>
                                <th scope="col">Present</th>
                                <th scope="col">Absent</th>
                                <th scope="col">Sanctioned Leave</th>
                                <th scope="col">Late</th>
                                <th class="attendance-col" scope="col">Attendance %</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={records} for:item="rec">
                                <tr key={rec.id}>
                                    <td class="course-col" title={rec.courseName}>{rec.courseName}</td>
                                    <td class="session-count-col">{rec.totalSessions}</td>
                                    <td>{rec.presentCount}</td>
                                    <td>{rec.absentCount}</td>
                                    <td>{rec.leaveCount}</td>
                                    <td>{rec.lateCount}</td>
                                    <td class="attendance-col">{rec.percentage}%</td>
                                </tr>
                            </template>
                        </tbody>
                        <tfoot>
                            <tr class="footer-row">
                                <td class="course-col">Total</td>
                                <td class="session-count-col">{totalsRow.totalSessions}</td>
                                <td>{totalsRow.presentCount}</td>
                                <td>{totalsRow.absentCount}</td>
                                <td>{totalsRow.leaveCount}</td>
                                <td>{totalsRow.lateCount}</td>
                                <td class="attendance-col">{overallAttendancePercent}%</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

            </div>
        </div>
    </div>
<template lwc:if={showSessionDetail}>
                    <div class="table-container slds-m-top_medium">
                        <div class="attendance-header" style="position:static; display:inline-block; margin-bottom:10px;">
                            Session Detail — {sessionDetailTitle}
                        </div>
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th scope="col">Course</th>
                                    <th scope="col">Session Date</th>
                                    <th scope="col">Timings</th>
                                    <th scope="col">Faculty</th>
                                    <th scope="col">Activity Type</th>
                                    <th scope="col">Attendance</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={sessionDetailRecords} for:item="s">
                                    <tr key={s.id}>
                                        <td>{s.courseName}</td>
                                        <td>{s.sessionDate}</td>
                                        <td>{s.timings}</td>
                                        <td>{s.faculty}</td>
                                        <td>{s.activityType}</td>
                                        <td>{s.attendanceStatus}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>    
</template>
