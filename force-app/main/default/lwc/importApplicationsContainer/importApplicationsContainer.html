<template>
    <lightning-card title="Import Applications">

        <div class="slds-p-around_medium">

            <lightning-radio-group
                name="importOption"
                label="Select Import Type"
                options={options}
                value={selectedOption}
                type="button"
                onchange={handleOptionChange}>
            </lightning-radio-group>

            <template if:true={showSelectionMessage}>
                <div class="slds-m-top_medium slds-text-color_weak">
                    Please select an import type to continue.
                </div>
            </template>

            <template if:true={showApplicantStateManagement}>
                <div class="slds-m-top_medium">
                    <c-import-applications></c-import-applications>
                </div>
            </template>

            <template if:true={showOfferGeneration}>
                <div class="slds-m-top_medium slds-text-color_weak">
                    <c-admission-decision-csv-importer></c-admission-decision-csv-importer>
                </div>
            </template>

        </div>

    </lightning-card>
</template>
