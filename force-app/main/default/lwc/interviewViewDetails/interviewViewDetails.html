<template>
    <div class="slds-card slds-m-around_medium">

        <div class="slds-card__header slds-p-horizontal_medium slds-p-top_medium slds-p-bottom_small">
            <h2 class="card-title">Interview Details</h2>
        </div>

        <div class="slds-card__body slds-p-around_medium">

            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                    <h2>{error}</h2>
                </div>
            </template>

            <template if:true={isEmpty}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <p class="slds-text-color_weak slds-text-heading_small">
                        No slot bookings found for this slot.
                    </p>
                </div>
            </template>

            <template if:true={headerInfo}>

                <div class="header-band slds-m-bottom_medium">
                    <div class="header-band__grid">

                        <div class="header-band__item">
                            <span class="header-band__label">Programme Name</span>
                            <span class="header-band__value">{headerInfo.programName}</span>
                        </div>

                        <div class="header-band__divider"></div>

                        <div class="header-band__item">
                            <span class="header-band__label">Round Name</span>
                            <span class="header-band__value">{headerInfo.roundMasterName}</span>
                        </div>

                        <div class="header-band__divider"></div>

                        <div class="header-band__item">
                            <span class="header-band__label">Panel Master</span>
                            <span class="header-band__value">
                                <lightning-record-view-form
                                    record-id={firstBookingId}
                                    object-api-name="ApplicationSlotBooking__c">
                                    <lightning-output-field
                                        field-name="Panel_Master__c"
                                        class="panel-field" variant="label-hidden">
                                    </lightning-output-field>
                                </lightning-record-view-form>
                            </span>
                        </div>

                    </div>
                </div>

                <div class="table-wrapper">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                        <thead>
                            <tr class="slds-line-height_reset table-head-row">
                                <th scope="col" class="col-sr"><div class="slds-truncate">Sr. No.</div></th>
                                <th scope="col"><div class="slds-truncate">Applicant Name</div></th>
                                <th scope="col"><div class="slds-truncate">Slot Date</div></th>
                                <th scope="col"><div class="slds-truncate">Slot Start Time</div></th>
                                <th scope="col"><div class="slds-truncate">Slot End Time</div></th>
                                <th scope="col"><div class="slds-truncate">Mode</div></th>
                                <th scope="col"><div class="slds-truncate">ASB Code</div></th>
                                <th scope="col"><div class="slds-truncate">My Eval Status</div></th>
                                <th scope="col"><div class="slds-truncate">Application PDF</div></th>
                                <template if:true={showStaticPdfCol}>
                                    <th scope="col"><div class="slds-truncate">Meritto Extract</div></th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={tableRows} for:item="b">
                                <tr key={b.id}>
                                    <td class="col-sr slds-text-align_center">{b.rowNum}</td>
                                    <td class="col-name">{b.applicantName}</td>
                                    <td>{b.slotDate}</td>
                                    <td>{b.slotStartTime}</td>
                                    <td>{b.slotEndTime}</td>
                                    <td>{b.mode}</td>
                                    <td>{b.name}</td>
                                    <td>
                                        <span class={b.evalBadgeClass}>{b.evalStatus}</span>
                                    </td>
                                    <td>
                                        <c-ap-preview-pdf record-id={b.applicationId}></c-ap-preview-pdf>
                                    </td>
                                    <template if:true={showStaticPdfCol}>
                                        <td>
                                            <lightning-button
                                                label="Preview PDF"
                                                variant="neutral"
                                                data-appid={b.applicationId}
                                                onclick={handlePreviewStaticPdf}>
                                            </lightning-button>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

            </template>
        </div>
    </div>
</template>
