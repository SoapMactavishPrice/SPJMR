<template>
    <div class="slds-card slds-m-around_medium">

        <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-horizontal_medium slds-p-top_medium">
            <h2 class="card-title">Interview Details</h2>
        </div>

        <div class="slds-card__body slds-p-around_medium">

            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <h2>{error}</h2>
                </div>
            </template>

            <template if:true={isEmpty}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <p class="slds-text-color_weak slds-text-heading_small">
                        No slot bookings found for this slot.
                    </p>
                </div>
            </template>


            <template if:true={isSingle}>

                <div class="slds-grid slds-grid_align-end slds-m-bottom_small">
                    <div class="status-banner">
                        <span class="status-label">My Evaluation Status</span>
                        <span class={singleEvalBadgeClass}>{singleEvalStatus}</span>
                    </div>
                </div>

                <lightning-record-view-form
                    record-id={singleBookingId}
                    object-api-name="ApplicationSlotBooking__c">

                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                            <lightning-output-field field-name="Applicant_Name__c"></lightning-output-field>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                            <lightning-output-field field-name="Program_Name__c"></lightning-output-field>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                            <lightning-output-field field-name="Application__c"></lightning-output-field>
                        </div>
                    </div>

                    <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                            <lightning-output-field field-name="Slot_Date__c"></lightning-output-field>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                            <lightning-output-field field-name="Slot_Start_Time__c"></lightning-output-field>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                            <lightning-output-field field-name="Slot_End_Time__c"></lightning-output-field>
                        </div>
                    </div>

                    <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                            <lightning-output-field field-name="Mode__c"></lightning-output-field>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                            <lightning-output-field field-name="Panel_Master__c"></lightning-output-field>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                            <lightning-output-field field-name="RoundMaster__c"></lightning-output-field>
                        </div>
                    </div>

                    <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                            <lightning-output-field field-name="Name"></lightning-output-field>
                        </div>
                    </div>

                </lightning-record-view-form>
            </template>

            <template if:true={isMultiple}>

                <div class="slds-tabs_default">
                    <ul class="slds-tabs_default__nav" role="tablist">
                        <template for:each={tabItems} for:item="tab">
                            <li key={tab.id} class={tab.liClass} role="presentation">
                                <a class="slds-tabs_default__link tab-link"
                                   role="tab"
                                   data-id={tab.id}
                                   onclick={handleTabClick}>
                                    {tab.label}
                                </a>
                            </li>
                        </template>
                    </ul>

                    <template if:true={activeBooking}>
                        <div class="slds-tabs_default__content slds-show slds-p-top_medium">

                            <div class="slds-grid slds-grid_align-end slds-m-bottom_small">
                                <div class="status-banner">
                                    <span class="status-label">My Evaluation Status</span>
                                    <span class={activeEvalBadgeClass}>{activeBooking.evalStatus}</span>
                                </div>
                            </div>

                            <lightning-record-view-form
                                record-id={activeBooking.id}
                                object-api-name="ApplicationSlotBooking__c">

                                <div class="slds-grid slds-wrap slds-gutters">
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                        <lightning-output-field field-name="Applicant_Name__c"></lightning-output-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                        <lightning-output-field field-name="Program_Name__c"></lightning-output-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                        <lightning-output-field field-name="Application__c"></lightning-output-field>
                                    </div>
                                </div>

                                <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                        <lightning-output-field field-name="Slot_Date__c"></lightning-output-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                        <lightning-output-field field-name="Slot_Start_Time__c"></lightning-output-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                        <lightning-output-field field-name="Slot_End_Time__c"></lightning-output-field>
                                    </div>
                                </div>

                                <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                        <lightning-output-field field-name="Mode__c"></lightning-output-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                        <lightning-output-field field-name="Panel_Master__c"></lightning-output-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                        <lightning-output-field field-name="RoundMaster__c"></lightning-output-field>
                                    </div>
                                </div>

                                <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                        <lightning-output-field field-name="Name"></lightning-output-field>
                                    </div>
                                </div>

                            </lightning-record-view-form>
                        </div>
                    </template>
                </div>

                <div class="slds-m-top_large">
                    <h3 class="section-subtitle slds-m-bottom_small">All Applicants in this Slot</h3>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate">#</div></th>
                                <th scope="col"><div class="slds-truncate">Applicant</div></th>
                                <th scope="col"><div class="slds-truncate">Program</div></th>
                                <th scope="col"><div class="slds-truncate">Slot Code</div></th>
                                <th scope="col"><div class="slds-truncate">Round</div></th>
                                <th scope="col"><div class="slds-truncate">My Eval Status</div></th>
                                <th scope="col"><div class="slds-truncate">Action</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={bookings} for:item="b">
                                <tr key={b.id}>
                                    <td>{b.rowNum}</td>
                                    <td>{b.applicantName}</td>
                                    <td>{b.programName}</td>
                                    <td>{b.name}</td>
                                    <td>{b.roundMasterName}</td>
                                    <td>
                                        <span class={b.evalBadgeClass}>{b.evalStatus}</span>
                                    </td>
                                    <td>
                                        <a class="tab-link" data-id={b.id} onclick={handleTabClick}>
                                            View Details
                                        </a>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

            </template>

        </div>
    </div>
</template>
