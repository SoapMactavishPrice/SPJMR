<template>
    <div class="form-container">
        <lightning-messages></lightning-messages>

        <template if:true={errorMessage}>
            <div class="error-banner">
                {errorMessage}
            </div>
        </template>

        <template if:true={isInitStep}>
            <div class="form-content">
                <div class="form-section">
                    <div class="section-header">
                        <h3 class="section-title">B2C Verification</h3>
                    </div>
                    <div class="form-row verification-row">
                        <div class="form-field email-col">
                            <label class="field-label"><abbr class="slds-required" title="required">*</abbr> Email</label>
                            <lightning-input
                                type="email"
                                value={email}
                                onchange={handleFieldChange}
                                data-field="email"
                                placeholder="Enter Applicant Email"
                                variant="label-hidden">
                            </lightning-input>
                        </div>
                        <div class="form-field phone-col">
                            <label class="field-label"><abbr class="slds-required" title="required">*</abbr> Phone</label>
                            <div class="phone-input-group">
                                <div class="code-wrap">
                                    <lightning-combobox
                                        value={countryCode}
                                        options={countryCodeOptions}
                                        onchange={handleCountryCodeChange}
                                        variant="label-hidden"
                                        placeholder="Code">
                                    </lightning-combobox>
                                </div>
                                <div class="number-wrap">
                                    <lightning-input
                                        type="tel"
                                        value={phone}
                                        maxlength={acceptedNumberLength}
                                        onchange={handleFieldChange}
                                        data-field="phone"
                                        pattern="[0-9]*"
                                        placeholder="Enter Applicant Phone"
                                        variant="label-hidden">
                                    </lightning-input>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <template if:true={isDetailsStep}>
        <div class="form-content">
            <template if:true={existingLeadId}>
                <div class="prefilled-indicator">
                    <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                    <span class="prefilled-text">Lead with this email or phone already exists (not converted). Data is prefilled.</span>
                </div>
            </template>
            <template if:true={hasApplicantAccount}>
                <div class="account-exists-indicator">
                    <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
                    <span class="prefilled-text">Applicant Account already exists for this email. Saving will create Opportunities for selected programs.</span>
                </div>
            </template>
            <!-- Section: Programs -->
            <div class="form-section">
                <div class="section-header">
                    <h3 class="section-title">Programs <span class="required-indicator">*</span></h3>
                </div>

                <div class="program-search-container">
                    <div class="search-input-wrapper">
                        <lightning-input
                            type="search"
                            label="Search Programs"
                            placeholder="Type to search programs..."
                            value={programSearchTerm}
                            onchange={handleProgramSearch}>
                        </lightning-input>
                    </div>
                    
                    <template if:true={showProgramSearchResults}>
                        <div class="search-results-dropdown">
                            <template if:true={isSearching}>
                                <div class="search-loading">
                                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                                    <span>Searching...</span>
                                </div>
                            </template>
                            <template if:false={isSearching}>
                                <template if:true={hasProgramSearchResults}>
                                    <template for:each={programSearchResults} for:item="program">
                                        <div key={program.value} class="search-result-item" onclick={handleAddProgram} data-id={program.value} data-name={program.label}>
                                            <span class="program-name">{program.label}</span>
                                            <template if:true={program.type}>
                                                <span class="program-type">{program.type}</span>
                                            </template>
                                            <lightning-icon icon-name="utility:add" size="x-small" class="add-icon"></lightning-icon>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={hasProgramSearchResults}>
                                    <div class="no-results">No programs found</div>
                                </template>
                            </template>
                        </div>
                    </template>
                </div>

                <div class="selected-programs-section">
                    <template if:true={hasSelectedPrograms}>
                        <table class="programs-table">
                            <thead>
                                <tr>
                                    <th>Program Name</th>
                                    <th class="action-column">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={selectedProgramsList} for:item="program">
                                    <tr key={program.id}>
                                        <td>{program.name}</td>
                                        <td class="action-column">
                                            <lightning-button-icon
                                                icon-name="utility:delete"
                                                variant="bare"
                                                size="small"
                                                alternative-text="Remove"
                                                onclick={handleRemoveProgram}
                                                data-id={program.id}>
                                            </lightning-button-icon>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                    <template if:false={hasSelectedPrograms}>
                        <div class="no-programs-message">
                            No programs selected. Use the search above to add programs.
                        </div>
                    </template>
                </div>
            </div>
            <!-- Section: Personal Information -->
            <div class="form-section">
                <div class="section-header">
                    <h3 class="section-title">Personal Information</h3>
                </div>
                
                <!-- Row 1: First Name, Last Name -->
                <div class="form-row verification-row">
                    <div class="form-field">
                        <lightning-input
                            label="First Name"
                            type="text"
                            value={firstName}
                            onchange={handleFieldChange}
                            data-field="firstName"
                            placeholder="Enter First Name"
                            required>
                        </lightning-input>
                    </div>
                    <div class="form-field">
                        <lightning-input
                            label="Last Name"
                            type="text"
                            value={lastName}
                            onchange={handleFieldChange}
                            data-field="lastName"
                            placeholder="Enter Last Name">
                        </lightning-input>
                    </div>
                </div>

                <!-- Row 2: Email, Phone -->
                <div class="form-row">
                    <div class="form-field email-col">
                        <lightning-input
                            label="Email"
                            type="email"
                            value={email}
                            onchange={handleFieldChange}
                            data-field="email"
                            placeholder="Enter Email"
                            required
                            disabled>
                        </lightning-input>
                        <template if:true={isCheckingLead}>
                            <div class="checking-lead-indicator">
                                <lightning-spinner alternative-text="Checking for existing lead" size="x-small"></lightning-spinner>
                                <span class="checking-text">Checking for existing lead...</span>
                            </div>
                        </template>
                        <template if:true={isPrefilled}>
                            <div class="prefilled-indicator">
                                <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                                <span class="prefilled-text">Existing lead found - Form prefilled</span>
                            </div>
                        </template>
                    </div>
                    <div class="form-field phone-col">
                        <label class="field-label"><abbr class="slds-required" title="required">*</abbr> Phone</label>
                        <div class="phone-input-group">
                            <div class="code-wrap">
                                <lightning-combobox
                                    value={countryCode}
                                    options={countryCodeOptions}
                                    onchange={handleCountryCodeChange}
                                    disabled
                                    placeholder="Code">
                                </lightning-combobox>
                            </div>
                            <div class="number-wrap">
                                <lightning-input
                                    type="tel"
                                    value={phone}
                                    onchange={handleFieldChange}
                                    data-field="phone"
                                    placeholder="Enter Phone"
                                    disabled>
                                </lightning-input>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Row 3: Date of Birth, Age -->
                <div class="form-row">
                    <div class="form-field">
                        <lightning-input
                            label="Date of Birth"
                            type="date"
                            value={dateOfBirth}
                            onchange={handleDateOfBirthChange}
                            data-field="dateOfBirth">
                        </lightning-input>
                    </div>
                    <div class="form-field">
                        <lightning-input
                            label="Age"
                            type="number"
                            value={age}
                            data-field="age"
                            placeholder="Enter Age"
                            read-only
                            min="0"
                            max="120">
                        </lightning-input>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <lightning-combobox
                            label="Lead Source"
                            value={leadSource}
                            options={leadSourceOptions}
                            onchange={handleFieldChange}
                            data-field="leadSource"
                            placeholder="Select Lead Source">
                        </lightning-combobox>
                    </div>
                    <div class="form-field">
                        <lightning-combobox
                            label="Gender"
                            value={leadGender}
                            options={genderOptions}
                            onchange={handleFieldChange}
                            data-field="leadGender"
                            placeholder="Lead Gender">
                        </lightning-combobox>
                    </div>
                    <template if:true={showLeadSourceOther}>
                        <div class="form-field">
                            <lightning-input
                                label="Other (please specify)"
                                type="text"
                                value={leadSourceOther}
                                onchange={handleFieldChange}
                                data-field="leadSourceOther"
                                placeholder="Describe how you heard about us">
                            </lightning-input>
                        </div>
                    </template>
                </div>
                <template lwc:if={showEventPicklist}>
                    <div class="form-row">
                        <div class="form-field full-width">
                            <lightning-combobox
                                label="Event"
                                value={selectedEvent}
                                options={eventOptions}
                                onchange={handleEventChange}
                                placeholder="Select an Event">
                            </lightning-combobox>

                            <template if:true={showPartnerEventInput}>
                                <lightning-input
                                    type="text"
                                    label="Partner Name"
                                    value={partnerName}
                                    onchange={handlePartnerNameChange}>
                                </lightning-input>
                            </template>
                            <template if:true={showEventPicklist}>
                                <div class="form-row">
                                    <div class="form-field">
                                        <lightning-combobox
                                            label="Event Country"
                                            value={eventCountryId}
                                            options={countryOptions}
                                            onchange={handleEventCountryChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="form-field">
                                        <lightning-combobox
                                            label="Event State"
                                            value={eventStateId}
                                            options={eventStateOptions}
                                            onchange={handleEventStateChange}
                                            disabled={isEventStateDisabled}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="form-field">
                                        <lightning-combobox
                                            label="Event City"
                                            value={eventCityId}
                                            options={eventCityOptions}
                                            onchange={handleEventCityChange}
                                            disabled={isEventCityDisabled}>
                                        </lightning-combobox>
                                    </div>
                                </div>
                            </template>
                            <template if:true={hasCampaignPickerEmptyMessage}>
                                <p class="campaign-picker-hint">
                                    No active campaigns found for this lead source.
                                </p>
                            </template>
                        </div>
                    </div>
                </template>
                <!-- <template if:true={showCampaignPicker}>
                    <div class="form-row">
                        <div class="form-field full-width">
                            <lightning-combobox
                                label="Campaign"
                                value={selectedCampaignId}
                                options={campaignOptions}
                                onchange={handleCampaignChange}
                                placeholder="Select a campaign (optional)">
                            </lightning-combobox>
                            <template if:true={hasCampaignPickerEmptyMessage}>
                                <p class="campaign-picker-hint">
                                    No active campaigns found for this lead source.
                                </p>
                            </template>
                        </div>
                    </div>
                </template> -->
            </div>

            <!-- Section: Address Information -->
            <div class="form-section">
                <div class="section-header">
                    <h3 class="section-title">Address Information</h3>
                </div>

                <!-- Row: Street Address -->
                <div class="form-row">
                    <div class="form-field full-width">
                        <lightning-input
                            label="Street Address"
                            type="text"
                            value={street}
                            onchange={handleFieldChange}
                            data-field="street"
                            placeholder="Enter Street Address">
                        </lightning-input>
                    </div>
                </div>

                <!-- Row: Country, State -->
                <div class="form-row">
                    <div class="form-field">
                        <lightning-combobox
                            label="Country"
                            value={selectedCountry}
                            options={countryOptions}
                            onchange={handleCountryChange}
                            placeholder="Select Country">
                        </lightning-combobox>
                    </div>
                    <div class="form-field">
                        <lightning-combobox
                            label="State"
                            value={selectedState}
                            options={stateOptions}
                            onchange={handleStateChange}
                            placeholder="Select State"
                            disabled={isStateDisabled}>
                        </lightning-combobox>
                    </div>
                </div>

                <!-- Row: City, Postal Code -->
                <div class="form-row">
                    <div class="form-field">
                        <lightning-combobox
                            label="District/City"
                            value={selectedCity}
                            options={cityOptions}
                            onchange={handleCityChange}
                            placeholder="Select City"
                            disabled={isCityDisabled}>
                        </lightning-combobox>
                    </div>
                    <div class="form-field">
                        <lightning-input
                            label="Postal Code"
                            type="text"
                            value={postalCode}
                            onchange={handleFieldChange}
                            data-field="postalCode"
                            placeholder="Enter Postal Code">
                        </lightning-input>
                    </div>
                </div>
            </div>

            <!-- Section: Education & Experience -->
            <div class="form-section">
                <div class="section-header">
                    <h3 class="section-title">Education & Experience</h3>
                </div>

                <!-- Row: Work Experience Question -->
                <div class="form-row">
                    <div class="form-field">
                        <label class="field-label">Do you have work experience?</label>
                        <lightning-radio-group
                            name="hasWorkExperience"
                            options={yesNoOptions}
                            value={hasWorkExperience}
                            onchange={handleWorkExperienceChange}
                            type="radio">
                        </lightning-radio-group>
                    </div>
                    <div class="form-field">
                        <template if:true={showWorkExperienceYears}>
                            <lightning-input
                                label="Years of Work Experience"
                                type="number"
                                value={yearsOfWorkExperience}
                                onchange={handleFieldChange}
                                data-field="yearsOfWorkExperience"
                                placeholder="Enter Years"
                                min="0">
                            </lightning-input>
                        </template>
                    </div>
                </div>

                <!-- Row: Entrance Exam Question -->
                <div class="form-row">
                    <div class="form-field">
                        <label class="field-label">Have you given an entrance exam?</label>
                        <lightning-radio-group
                            name="hasEntranceExam"
                            options={yesNoOptions}
                            value={hasEntranceExam}
                            onchange={handleEntranceExamChange}
                            type="radio">
                        </lightning-radio-group>
                    </div>
                    <div class="form-field">
                        <template if:true={showEntranceExamName}>
                            <lightning-combobox
                                label="Entrance Exam Name"
                                value={entranceExamName}
                                options={entranceExamOptions}
                                onchange={handleFieldChange}
                                data-field="entranceExamName"
                                placeholder="Select Exam">
                            </lightning-combobox>
                        </template>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label class="field-label">Are you working with SPJIMR Partner Company?</label>
                        <lightning-radio-group
                            name="partnerCompany"
                            options={yesNoOptions}
                            value={partnerCompany}
                            onchange={handlePartnerCompanyChange}
                            type="radio">
                        </lightning-radio-group>
                    </div>
                    <div class="form-field">
                        <template if:true={showOrganizationField}>
                            <lightning-input
                                label="Enter Organization"
                                value={organizationName}
                                type="text"
                                onchange={handleFieldChange}
                                data-field="organizationName"
                                placeholder="Organization Name">
                            </lightning-input>
                        </template>
                    </div>
                </div>


                 <div class="form-row">
                    <div class="form-field">
                        <label class="field-label">Have you completed your Graduation?</label>
                        <lightning-radio-group
                            name="graduation"
                            options={yesNoOptions}
                            value={graduation}
                            onchange={handleCompletedGraduation}
                            type="radio">
                        </lightning-radio-group>
                    </div>
                    <div class="form-field">
                        <template if:true={showStudyingIn}>
                            <lightning-combobox
                                label="Select Currently Studying In"
                                value={studyingIn}
                                options={studyingInOptions}
                                onchange={handleFieldChange}
                                data-field="studyingIn"
                                placeholder="Select Course">
                            </lightning-combobox>
                        </template>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label class="field-label">How Did you get to know about SPJIMR?</label>
                        <lightning-input
                            name="howdidyouknow"
                            onchange={handleHowDidYouKnow}
                            value={howDidYouKnow}
                            type="text">
                        </lightning-input>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="section-header">
                    <h3 class="section-title">Additional Information</h3>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <lightning-input
                            type="checkbox"
                            label="Are you NRI?"
                            checked={areYouNri}
                            onchange={handleAreYouNriChange}>
                        </lightning-input>
                    </div>
                </div>
            </div>
        </div>
        </template>

        <div class="form-footer">
            <lightning-button
                label={backButtonLabel}
                onclick={handleBack}
                class="slds-m-right_small">
            </lightning-button>

            <template if:true={isInitStep}>
                <lightning-button
                    variant="brand"
                    label="Next"
                    onclick={handleInitialNext}
                    disabled={isCheckingLead}>
                </lightning-button>
            </template>
            <template if:true={isDetailsStep}>
                <lightning-button
                    variant="brand"
                    label="Save"
                    onclick={handleSave}
                    disabled={isSaving}>
                </lightning-button>
            </template>
        </div>
    </div>
</template>
