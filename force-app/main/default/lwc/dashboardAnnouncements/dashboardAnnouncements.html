<template>
    <template lwc:if={hasAnnouncements}>
        <div class="updates-container">
            <article class="updates-card">
                <div class="card-header">
                    <h3 class="title">{sectionLabel}</h3>
                    <span class="badge">{updateLabel}</span>
                </div>
                <template for:each={announcements} for:item="announcement" for:index="index">
                    <div class="announcement" key={announcement.scenario}>
                        <div class="announcement-body" lwc:dom="manual" data-index={index}></div>
                    </div>
                </template>
            </article>
        </div>
    </template>
</template>
