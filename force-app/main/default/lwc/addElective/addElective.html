<template>
    <lightning-card title="ADD MAJOR / MINOR" icon-name="custom:custom14">
        <lightning-layout multiple-rows>
            <lightning-layout-item size="6" small-device-size="6" medium-device-size="6" large-device-size="6"
                padding="around-small">
                <div class="form-group">
                    <lightning-combobox name="majorgrade" label="Major Grade" value={major} options={majorgradeOptions}
                        onchange={handleMajorGradeChange} required>
                    </lightning-combobox>
                </div>
            </lightning-layout-item>
            <lightning-layout-item size="6" small-device-size="6" medium-device-size="6" large-device-size="6"
                padding="around-small" style="margin-top: 20px">
                <div class="form-group">
                    <lightning-input 
                        type="checkbox" 
                        label="Do you want to change the Grade ?" 
                        checked={isChecked} 
                        onchange={handleCheckboxChange}>
                    </lightning-input>
                </div>
            </lightning-layout-item>
            <lightning-layout-item size="6" small-device-size="6" medium-device-size="6" large-device-size="6"
                padding="around-small" if:true={isChangeMajor}>
                <div class="form-group">
                    <lightning-combobox name="changemajorgrade" label="Select Major" value={gradId} options={changeMajorgradeOptions}
                        onchange={handleGradeChange} required>
                    </lightning-combobox>
                </div>
            </lightning-layout-item>
            <lightning-layout-item size="6" small-device-size="6" medium-device-size="6" large-device-size="6"
                padding="around-small" if:true={isChangeMajor}>
                <div class="form-group">
                    <lightning-combobox name="minorgrade" label="Select Minor" value={minor} options={minorOptions}
                        onchange={handleMinorGradeChange} required>
                    </lightning-combobox>
                </div>
            </lightning-layout-item>
        </lightning-layout>
    </lightning-card>
    
    <lightning-card title="ADD ELECTIVE" icon-name="custom:custom14">
        <lightning-layout multiple-rows>
            <!-- <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6"
                padding="around-small">
                <div class="form-group">
                    <lightning-combobox name="grade" label="Grade" value={grade} options={gradeOptions}
                        onchange={handleGradeChange} required>
                    </lightning-combobox>
                </div>
            </lightning-layout-item> -->
            <lightning-layout-item size="3" small-device-size="3" medium-device-size="3" large-device-size="3"
                padding="around-small">
                <div class="form-group">
                    <lightning-combobox name="term" label="Term" value={term} options={termOptions}
                        onchange={handleTermChange} required>
                    </lightning-combobox>
                </div>
            </lightning-layout-item>



            <lightning-layout-item size="3" small-device-size="3" medium-device-size="3" large-device-size="3"
                padding="around-small">
                <div class="form-group">
                    <lightning-input label="Total Credit" value={totalCredit} readonly>
                    </lightning-input>
                </div>
            </lightning-layout-item>

            <lightning-layout-item size="3" small-device-size="3" medium-device-size="3" large-device-size="3"
                padding="around-small">
                    <lightning-input label="Added Credit" value={addedCredit} readonly>
                    </lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="3" small-device-size="3" medium-device-size="3" large-device-size="3"
                padding="around-small">
                <lightning-input label="Balance Credit" value={balanceCredit} readonly>
                </lightning-input>
            </lightning-layout-item>
        </lightning-layout>
        <template if:true={showSpinner}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
         </template>
        <!-- Data Table -->
        
        <section class="section" style="margin-left: 10px; margin-right: 10px;" if:true={minTerm}>
            <h2>Major Lecture's</h2>
        </section>
        <lightning-layout multiple-rows if:true={minTerm}>
            <lightning-layout-item size="6" small-device-size="6" medium-device-size="6" large-device-size="6"
                padding="around-small">
                <section class="section">
                    <h2>MANDATORY</h2>
                </section>
                <lightning-datatable data={major_mandatorytableData} columns={columnsMan} key-field="id"
                hide-checkbox-column ="true"
                max-row-selection="5">
            </lightning-datatable>
            </lightning-layout-item>
            <lightning-layout-item size="6" small-device-size="6" medium-device-size="6" large-device-size="6"
                padding="around-small">
                <section class="section">
                    <h2>ELECTIVE</h2>
                </section>
                <lightning-datatable data={major_electivetableData} columns={columnsElec} key-field="id" onrowselection={handleRowSelection}
                max-row-selection="5">
            </lightning-datatable>
            </lightning-layout-item>
        </lightning-layout>

        <section class="section" style="margin-left: 10px; margin-right: 10px;" if:true={minTerm}>
            <h2>Minor Lecture's</h2>
        </section>
        <lightning-layout multiple-rows if:true={minTerm}>
            <lightning-layout-item size="6" small-device-size="6" medium-device-size="6" large-device-size="6"
                padding="around-small">
                <section class="section">
                    <h2>MANDATORY</h2>
                </section>
                <lightning-datatable data={minor_mandatorytableData} columns={columnsMan} key-field="id"
                hide-checkbox-column ="true" 
                max-row-selection="5">
            </lightning-datatable>
            </lightning-layout-item>
            <lightning-layout-item size="6" small-device-size="6" medium-device-size="6" large-device-size="6"
                padding="around-small">
                <section class="section">
                    <h2>ELECTIVE</h2>
                </section>
                <lightning-datatable data={minor_electivetableData} columns={columnsElec} key-field="id" onrowselection={handleRowSelection}
                max-row-selection="5">
            </lightning-datatable>
            </lightning-layout-item>
        </lightning-layout>
       
        <div style="text-align: center;" if:true={minTerm}>    
            <lightning-button  label="Save" variant="brand" onclick={handleSave} class="slds-m-top_medium"
                style="margin: auto;">
            </lightning-button>
        </div>
    </lightning-card>
</template>
