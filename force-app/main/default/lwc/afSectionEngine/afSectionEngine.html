<template>
    <div lwc:if={showTitle} class="sectionHeader">
        <p class="slds-align_absolute-center">{title}</p>
    </div>
    <template for:each={_sections} for:item="section">
        <div key={section.key} class="section">
            <template lwc:if={section.hideTitle}>
            </template>
            <template lwc:else>
                <h3 class="section-title">
                    {section.title}
                </h3>
            </template>
            <template for:each={section.rows} for:item="row">
                <div key={row.key} class="row" style={row.style}>
                    <template for:each={row.columns} for:item="col">
                        <template if:true={collapseHiddenColumns}>
                            <template if:true={col._hasVisibleField}>
                                <div key={col.key} class="col" style={col.widthStyle}>
                                    <template if:true={col.header}><div class="col-header">{col.header}</div></template>
                                    <template for:each={col.fields} for:item="f">
                                        <div key={f.key} class="field-cell">
                                            <c-af-field-renderer section-name={section.key} field={f.meta} value={f.value} context={context} onfieldchange={handleFieldChange} onvisibilitychange={handleVisibilityChange} onactionclick={handleActionClick}></c-af-field-renderer>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </template>

                        <template if:false={collapseHiddenColumns}>
                            <div key={col.key} class="col" style={col.widthStyle}>
                                <template if:true={col.header}><div class="col-header">{col.header}</div></template>
                                <template for:each={col.fields} for:item="f">
                                    <div key={f.key} class="field-cell">
                                        <c-af-field-renderer section-name={section.key} field={f.meta} value={f.value} context={context} onfieldchange={handleFieldChange} onvisibilitychange={handleVisibilityChange} onactionclick={handleActionClick}></c-af-field-renderer>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </template>

                </div>
            </template>
        </div>
    </template>
</template>
