<template>
    <div class="container">

        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Processing" size="small"></lightning-spinner>
        </template>
    
        <template lwc:if={hasError}>
            <div class="error-box" role="alert">{errorMessage}</div>
        </template>

        <template lwc:else>

            <!-- ================= WHAT THIS ACTION WILL DO ================= -->
            <template lwc:if={showIncompleteUI}>
                <p class="action-summary">
                    This application will be marked <strong>Incomplete</strong> and returned to the
                    student for correction. It stays at the current approval level.
                </p>
            </template>

            <template lwc:if={showPOApproveUI}>
                <p class="action-summary">
                    This application will be <strong>approved and forwarded</strong> to the Manager.
                </p>
            </template>

            <template lwc:if={showPORejectUI}>
                <p class="action-summary">
                    This application will be <strong>rejected</strong>.
                </p>
            </template>

            <template lwc:if={showManagerApproveUI}>
                <p class="action-summary">
                    This application will be <strong>approved</strong> (sanctioned leave).
                </p>
            </template>

            <template lwc:if={showDeputyApproveUI}>
                <p class="action-summary">
                    This application will be given <strong>final approval</strong>.
                </p>
            </template>

            <template lwc:if={showManagerRejectUI}>
                <p class="action-summary">
                    This application will be marked <strong>not approved</strong> (not sanctioned).
                </p>
            </template>

            <!-- ================= MAKEUP ELIGIBILITY (APPROVE) ================= -->
            <template lwc:if={showMakeupChoice}>
                <div class="section checkbox-row">
                    <lightning-input
                        type="checkbox"
                        label="Eligible for Makeup"
                        checked={eligibleForMakeup}
                        disabled={disableEligible}
                        onchange={handleEligible}>
                    </lightning-input>

                    <lightning-input
                        type="checkbox"
                        label="Not Eligible for Makeup"
                        checked={notEligibleForMakeup}
                        disabled={disableNotEligible}
                        onchange={handleNotEligible}>
                    </lightning-input>
                </div>
            </template>

            <!-- ================= ROUTE TO DEPUTY (MANAGER APPROVE) ================= -->
            <template lwc:if={showManagerApproveUI}>
                <div class="section">
                    <lightning-input
                        type="checkbox"
                        label="Route to Deputy Chairperson"
                        checked={routeToDeputy}
                        onchange={handleDeputy}>
                    </lightning-input>
                </div>
            </template>

            <!-- ================= MAKEUP ELIGIBILITY (REJECT) ================= -->
            <template lwc:if={showManagerRejectUI}>
                <div class="section">
                    <lightning-input
                        type="checkbox"
                        label="Not Eligible for Makeup"
                        checked={notEligibleForMakeup}
                        onchange={handleNotEligible}>
                    </lightning-input>
                </div>
            </template>

            <!-- ================= REMARKS ================= -->
            <div class="section remarks-wrapper">
                <lightning-textarea
                    label="Remarks"
                    value={remarks}
                    required
                    onchange={handleRemarks}>
                </lightning-textarea>
            </div>

        </template>

        <!-- ================= BUTTONS ================= -->
        <div class="button-container">
            <lightning-button
                label="Cancel"
                onclick={handleCancel}>
            </lightning-button>

            <lightning-button
                class="slds-m-left_x-small"
                variant="brand"
                label={submitLabel}
                disabled={isSubmitDisabled}
                onclick={handleSubmit}>
            </lightning-button>
        </div>

    </div>
</template>
